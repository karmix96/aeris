# AERIS — BWB wide exploration config (25 sections, sym + diff controls, variable bounds)
#
# Purpose: design space exploration with both pitch and roll authority.
#   - Same planform bounds as bwb_training_v2 (17 DVs, well-validated range)
#   - 25 sections (same as bwb_canary_fixed / asym_controls for consistency)
#   - Two control surfaces: elevon_sym (d1) + elevon_diff (d2)
#   - Suitable for ML training datasets that include both pitch and roll sweeps
#   - Use this when you want training data with geometry variation + both sweep types
#
# Difference from bwb_training_v2:
#   - n_spline_inboard: 16 (vs 10) — finer surface for AVL paneling
#   - n_spline_outboard: 10 (vs 5)  — ditto
#   - save_plot: false (fast dataset generation)
#
# Typical usage:
#   aeris dataset aero-generate -c configs/geometry/bwb_explore_wide.yaml \
#     --n 50 --name explore_v1 \
#     --alpha-values "-8,-4,0,4,8" --velocity-values "20,28,36" \
#     --altitude-values "0,500,1000" \
#     --control-input-values "-15,-10,-5,0,5,10,15" \
#     --diff-input-values "-15,-5,0,5,15"

name: bwb_explore_wide

geometry:
  generator:
    id: bwb_segmented_v1
    seed: 100

  controls:
    n_points: 10
    n_spline_inboard: 16
    n_spline_outboard: 10
    spline_split_ratio: 0.55
    segment_length_variation: 0.15
    sweep_variation: 0.05
    desired_curvature_strength: 0.80

  planform_bounds:
    c1_m:        {min: 1.20, max: 2.00}
    c2_ratio:    {min: 0.45, max: 0.65}
    c3_ratio:    {min: 0.30, max: 0.45}
    c4_ratio:    {min: 0.08, max: 0.20}
    b_total_m:   {min: 1.20, max: 2.00}
    b3_ratio:    {min: 0.45, max: 0.55}
    split_ratio: {min: 0.35, max: 0.55}
    sw1_deg:     {min: 30.0, max: 55.0}
    sw2_deg:     {min: 10.0, max: 45.0}
    sw3_deg:     {min:  0.0, max: 30.0}

  section_bounds:
    airfoil_name: naca4412
    dihedral_root_deg: 0.0
    twist_b0_deg:    {min: -2.0, max:  2.0}
    twist_b1_deg:    {min: -4.0, max:  2.0}
    twist_b2_deg:    {min: -5.0, max:  2.0}
    twist_b3_deg:    {min: -6.0, max:  2.0}
    dihedral_b1_deg: {min:  0.0, max:  5.0}
    dihedral_b2_deg: {min:  0.0, max:  8.0}
    dihedral_b3_deg: {min:  0.0, max: 10.0}

  control_surfaces:
    enabled: true
    surfaces:
      # d1 — symmetric pitch authority
      - name: elevon_sym
        family: trailing_edge
        hinge_point: 0.75
        symmetric: true
        spanwise:
          start_frac: 0.60
          end_frac: 0.95
        deflection_sign: standard
        required: false

      # d2 — antisymmetric roll authority
      - name: elevon_diff
        family: trailing_edge
        hinge_point: 0.75
        symmetric: false
        side: right
        spanwise:
          start_frac: 0.60
          end_frac: 0.95
        deflection_sign: standard
        required: false

  outputs:
    save_plot: false
    build_aerosandbox: true

dataset:
  sampling:
    method: lhs_v1
    seed: 123
