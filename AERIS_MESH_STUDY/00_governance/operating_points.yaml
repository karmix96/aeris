    chord implies a freestream of about 1.7 m/s, which is not the mission.'
  speed_mps: 28.0
  altitude_m: 1500.0
  reference_chord_m: 0.056
  chord_source: min(c1_m) * min(c4_ratio) = 0.70 * 0.08
  temperature_K: 278.4
  pressure_Pa: 84556.26746052071
  density_kg_m3: 1.0580517702823453
  dynamic_viscosity_Pa_s: 1.7418672487754365e-05
  reynolds: 95244.06506690112
  is_flight_point: false
- id: Re_nom
  definition: nominal reference chord at nominal mission point
  speed_mps: 28.0
  altitude_m: 1500.0
  reference_chord_m: 0.9
