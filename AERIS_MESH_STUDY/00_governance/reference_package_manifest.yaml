  bytes: 2919
  verification: byte-for-byte match to git-history parent of delete commit, re-verified
    after relocation
  location_rationale: 'Held inside the study tree, not in configs/geometry/. DECISION-0001
    consolidated the repository to a single geometry config, and the study storage rule
    keeps study inputs under AERIS_MESH_STUDY/. Restoring a second live-looking config
    into configs/geometry/ would reopen the exact ambiguity DECISION-0001 closed.'
  status: HISTORICAL_REGRESSION_INPUT_ONLY
  authoritative_for: reproducing and explaining the July 2026 cap4 campaign
  not_authoritative_for: 'any current-design-space result, including epsE_common_start,
    strategy scoring, surface/volume laws and success-rate claims'
historical_config_divergence:
  summary: 'The restored config is NOT a subset of the current design space. It is the
    pre-rescale aircraft that DECISION-0002 explicitly replaced, and it violates two
    invariants frozen in geometry_topology_contract.json.'
  compared_against: configs/geometry/bwb.yaml (sha256 f114b48e3c400a2832cc3763e7cf7505ecd0925fb81cb92f70e28bb5e6234614)
  differences:
  - field: c1_m
    historical: 1.2 - 2.0 m
    current: 0.70 - 1.10 m
  - field: b_total_m (semi-span)
    historical: 1.2 - 2.0 m, i.e. full span 2.4 - 4.0 m
    current: 0.75 - 1.25 m, i.e. full span 1.5 - 2.5 m
  - field: sw1_deg / sw2_deg / sw3_deg
    historical: 30-55 / 10-45 / 0-30 deg
    current: 20-40 / 15-35 / 5-25 deg
  - field: airfoils
    historical: no station_airfoils; naca4412 fallback applied to the whole wing
    current: station_airfoils b0=mh91, b1=mh91, b2=e374, b3=nlf1015
    contract_conflict: geometry_topology_contract.json airfoil_assignment
  - field: dihedral_b1_deg
    historical: 0 - 5 deg
    current: pinned 0.0
    contract_conflict: geometry_topology_contract.json flat_root_panel invariant; seed
      0 under the historical config yields dihedral_b1 = 3.65 deg, a canted root panel
  - field: active design variables
    historical: 17 (no elevon_bounds)
    current: 20
  consequence: 'Any epsE value calibrated on the historical ten geometries would be
    tuned on a roughly 4 m span NACA 4412 wing with a canted root panel, then frozen
    as the trusted starting point for a 1.5-2.5 m span BWB with three different
    airfoils. Stage 01 must therefore calibrate epsE_common_start on the current design
    space; see lhs_authority.yaml, set epse_calibration_lhs10_seed7_samples.csv.'
  generator_drift_warning: 'Eight commits touched params.py, sampling.py, planform.py
    or sections.py between the historical config''s last version (2026-06-11) and HEAD,
    including a49ee51 (DECISION-0002). The n=10 campaign report stores only seed,
    block_count and quality metrics - it stores no per-sample design variables - so
    there is no way to verify that seeds 0-9 under today''s generator reproduce the
    July geometries. Historical reproduction is therefore qualitative: expect the same
    failure mechanism and region, do not expect identical numbers.'
