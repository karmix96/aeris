<title>S8 Aero Workbench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#e9ecf0; --panel:#fff; --panel2:#f5f7f9; --panel3:#eceff3;
  --line:#ccd2da; --line2:#dde2e8;
  --ink:#1c2128; --ink2:#5a6472; --ink3:#8a94a1;
  --accent:#1a6ba8; --accent2:#0d4a78; --accentbg:#e4eef7;
  --good:#1f7a4d; --warn:#9c6410; --bad:#a82e28;
  --goodbg:#e3f2ea; --warnbg:#fbf0dc; --badbg:#f9e5e3;
  --vp:#12161b; --vpgrid:#2a323b; --vpink:#c9d3de;
  --r:3px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15191e; --panel:#1e2329; --panel2:#191e24; --panel3:#232931;
  --line:#2f3740; --line2:#272e36;
  --ink:#dce3ea; --ink2:#8e99a6; --ink3:#69737f;
  --accent:#4b9fd8; --accent2:#6fb6e4; --accentbg:#1a2c3b;
  --good:#4caf7d; --warn:#d69a3c; --bad:#e0675f;
  --goodbg:#16281f; --warnbg:#2b2214; --badbg:#2d1a18;
}}
:root[data-theme="dark"]{
  --bg:#15191e; --panel:#1e2329; --panel2:#191e24; --panel3:#232931;
  --line:#2f3740; --line2:#272e36;
  --ink:#dce3ea; --ink2:#8e99a6; --ink3:#69737f;
  --accent:#4b9fd8; --accent2:#6fb6e4; --accentbg:#1a2c3b;
  --good:#4caf7d; --warn:#d69a3c; --bad:#e0675f;
  --goodbg:#16281f; --warnbg:#2b2214; --badbg:#2d1a18;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:13px/1.45 "IBM Plex Sans",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- frame ---------- */
#app{display:flex;flex-direction:column;height:100%;min-height:0}
#top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
#top h1{margin:0;font-size:14px;font-weight:600;letter-spacing:-.1px;white-space:nowrap}
#top h1 span{color:var(--ink3);font-weight:400}
.crumb{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--ink2);
  font-family:"IBM Plex Mono",monospace}
.crumb b{color:var(--ink);font-weight:500}
.spacer{flex:1 1 auto}
.tbtn{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);
  padding:4px 9px;font-size:11.5px;cursor:pointer;color:var(--ink2)}
.tbtn:hover{border-color:var(--accent);color:var(--ink)}

/* stage tabs */
#stages{display:flex;gap:0;background:var(--panel2);border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:thin}
#stages button{flex:0 0 auto;background:none;border:none;border-right:1px solid var(--line2);
  border-bottom:2px solid transparent;padding:8px 16px;cursor:pointer;
  font-size:12px;font-weight:500;color:var(--ink2);white-space:nowrap;
  display:flex;align-items:center;gap:7px}
#stages button .n{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink3);
  background:var(--panel3);border-radius:2px;padding:1px 4px}
#stages button:hover{color:var(--ink);background:var(--panel3)}
#stages button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);
  background:var(--panel)}
#stages button[aria-selected="true"] .n{background:var(--accentbg);color:var(--accent)}

/* three panes */
#main{flex:1 1 auto;display:grid;grid-template-columns:232px minmax(0,1fr) 330px;
  min-height:0;gap:1px;background:var(--line)}
.pane{background:var(--panel);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.pane>header{flex:0 0 auto;padding:6px 10px;background:var(--panel2);
  border-bottom:1px solid var(--line);font-size:10.5px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);
  display:flex;align-items:center;gap:8px}
.pane>.body{flex:1 1 auto;overflow:auto;min-height:0}
#viewpane{background:var(--vp)}
#viewpane>header{background:#1a1f25;border-color:#2a323b;color:#8d99a6}

/* outline tree */
.tree{padding:6px 0;font-size:12px}
.tree .grp{padding:6px 10px 3px;font-size:10px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink3)}
.tree a{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 16px;
  cursor:pointer;color:var(--ink2);text-decoration:none;border-left:2px solid transparent}
.tree a:hover{background:var(--panel3);color:var(--ink)}
.tree a.on{background:var(--accentbg);color:var(--accent);border-left-color:var(--accent);
  font-weight:500}
.tree a .dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;background:var(--ink3)}
.tree a .dot.ok{background:var(--good)} .tree a .dot.no{background:var(--bad)}
.tree a .dot.wa{background:var(--warn)}
.tree a small{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:10px;
  color:var(--ink3)}

/* details panel */
.grp-h{padding:7px 11px;background:var(--panel2);border-top:1px solid var(--line2);
  border-bottom:1px solid var(--line2);font-size:10.5px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);
  display:flex;align-items:center;gap:6px;cursor:pointer;position:sticky;top:0;z-index:2}
.grp-h .tw{font-size:9px;color:var(--ink3);transition:transform .12s}
.grp-h.closed .tw{transform:rotate(-90deg)}
.rows{display:block}
.rows.hid{display:none}
.row{display:grid;grid-template-columns:1fr 104px;gap:8px;align-items:center;
  padding:3px 11px;min-height:25px}
.row:hover{background:var(--panel2)}
.row>label{font-size:11.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.row>label .u{color:var(--ink3);font-size:10px}
.row input[type=number],.row input[type=text],.row select{width:100%;padding:2px 5px;
  background:var(--panel);border:1px solid var(--line);border-radius:2px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;text-align:right}
.row select{text-align:left}
.row input:disabled{background:var(--panel3);color:var(--ink3)}
.row .val{font-family:"IBM Plex Mono",monospace;font-size:11px;text-align:right;
  color:var(--ink);padding-right:5px}
.row .val.d{color:var(--ink2)}
.row input[type=checkbox]{width:auto;justify-self:end;margin:0;accent-color:var(--accent)}
.row input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.wide{grid-template-columns:1fr}
.note{padding:5px 11px 8px;font-size:11px;color:var(--ink2);line-height:1.5}
.note b{color:var(--ink);font-weight:500}
.pill{display:inline-block;padding:1px 6px;border-radius:9px;font-size:10px;
  font-weight:500;font-family:"IBM Plex Mono",monospace}
.pill.ok{background:var(--goodbg);color:var(--good)}
.pill.no{background:var(--badbg);color:var(--bad)}
.pill.wa{background:var(--warnbg);color:var(--warn)}
.pill.i{background:var(--accentbg);color:var(--accent)}

/* viewport */
#vpwrap{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
#vpwrap canvas{display:block;width:100%;height:100%}
.vptools{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.vptools button,.vptools select{background:#252c34;border:1px solid #333c46;
  color:#c2ccd8;border-radius:2px;padding:2px 7px;font-size:10.5px;cursor:pointer}
.vptools button:hover{border-color:#4b9fd8;color:#fff}
.vptools button.on{background:#17364e;border-color:#4b9fd8;color:#8ec7ee}
.vplegend{position:absolute;left:10px;bottom:10px;background:rgba(18,22,27,.86);
  border:1px solid #2d353e;border-radius:3px;padding:7px 9px;font-size:10px;
  color:#aeb9c5;font-family:"IBM Plex Mono",monospace;pointer-events:none;max-width:62%}
.vplegend .sw{display:inline-block;width:9px;height:9px;border-radius:2px;
  margin-right:5px;vertical-align:-1px}
.vpstat{position:absolute;right:10px;top:10px;background:rgba(18,22,27,.86);
  border:1px solid #2d353e;border-radius:3px;padding:7px 9px;font-size:10px;
  color:#aeb9c5;font-family:"IBM Plex Mono",monospace;pointer-events:none;text-align:right}
.vpstat b{color:#e4ebf2;font-weight:500}

/* console */
#console{flex:0 0 auto;max-height:118px;overflow:auto;background:var(--panel2);
  border-top:1px solid var(--line);padding:5px 12px;
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;line-height:1.65;color:var(--ink2)}
#console div{white-space:pre-wrap;word-break:break-word}
#console .t{color:var(--ink3)}
#console .ok{color:var(--good)} #console .no{color:var(--bad)}
#console .wa{color:var(--warn)} #console .hi{color:var(--accent)}

/* tables */
table{border-collapse:collapse;width:100%;font-size:11px}
th,td{padding:3px 7px;text-align:right;border-bottom:1px solid var(--line2);
  white-space:nowrap}
th{position:sticky;top:0;background:var(--panel2);font-size:10px;font-weight:600;
  color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;z-index:1}
th:hover{color:var(--accent)}
th.l,td.l{text-align:left}
td{font-family:"IBM Plex Mono",monospace}
td.s{font-family:"IBM Plex Sans",sans-serif}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel2)}
tbody tr.sel{background:var(--accentbg)}
.tbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 10px;
  border-bottom:1px solid var(--line2);background:var(--panel)}
.tbar select,.tbar input{padding:2px 5px;background:var(--panel);border:1px solid var(--line);
  border-radius:2px;font-size:11px}
.tbar .ct{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  color:var(--ink3)}

/* misc */
.msg{padding:14px;color:var(--ink2);font-size:12px;line-height:1.6}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 11px;
  font-size:11px}
.kv dt{color:var(--ink2)} .kv dd{margin:0;font-family:"IBM Plex Mono",monospace}
hr.sep{border:none;border-top:1px solid var(--line2);margin:0}
.warnbox{margin:8px 11px;padding:7px 9px;border-radius:var(--r);font-size:11px;
  line-height:1.5;background:var(--warnbg);color:var(--warn);
  border:1px solid color-mix(in srgb,var(--warn) 28%,transparent)}
.warnbox.bad{background:var(--badbg);color:var(--bad);
  border-color:color-mix(in srgb,var(--bad) 28%,transparent)}
.warnbox.good{background:var(--goodbg);color:var(--good);
  border-color:color-mix(in srgb,var(--good) 28%,transparent)}
.warnbox b{font-weight:600}
.btnrow{display:flex;gap:6px;padding:8px 11px;flex-wrap:wrap}
.btn{flex:1 1 auto;background:var(--accent);color:#fff;border:1px solid var(--accent);
  border-radius:var(--r);padding:5px 10px;font-size:11.5px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.sec{background:var(--panel2);color:var(--ink2);border-color:var(--line)}
.btn.sec:hover{background:var(--panel3);color:var(--ink);border-color:var(--accent)}
.drop{margin:8px 11px;padding:14px 10px;border:1.5px dashed var(--line);border-radius:var(--r);
  text-align:center;font-size:11px;color:var(--ink3);cursor:pointer}
.drop.over{border-color:var(--accent);color:var(--accent);background:var(--accentbg)}

@media (max-width:980px){
  #main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(320px,1fr) auto}
  #treepane{max-height:150px}
  #detailpane{max-height:46vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">
  <div id="top">
    <h1>S8 Aero Workbench <span>&middot; O&ndash;H structured</span></h1>
    <div class="crumb" id="crumb"></div>
    <div class="spacer"></div>
    <button class="tbtn" id="themebtn" type="button">Theme</button>
  </div>

  <div id="stages" role="tablist">
    <button role="tab" data-stage="geom"  aria-selected="true"><span class="n">1</span>Geometry</button>
    <button role="tab" data-stage="mesh"  aria-selected="false"><span class="n">2</span>Mesh</button>
    <button role="tab" data-stage="solve" aria-selected="false"><span class="n">3</span>Solver</button>
    <button role="tab" data-stage="post"  aria-selected="false"><span class="n">4</span>Results</button>
    <button role="tab" data-stage="valid" aria-selected="false"><span class="n">5</span>Validation</button>
    <button role="tab" data-stage="gci"   aria-selected="false"><span class="n">6</span>Convergence</button>
  </div>

  <div id="main">
    <div class="pane" id="treepane">
      <header>Outline</header>
      <div class="body"><div class="tree" id="tree"></div></div>
    </div>

    <div class="pane" id="viewpane">
      <header><span id="vptitle">View</span><div class="spacer"></div>
        <div class="vptools" id="vptools"></div></header>
      <div id="vpwrap">
        <canvas id="vp"></canvas>
        <div class="vplegend" id="vplegend" hidden></div>
        <div class="vpstat" id="vpstat" hidden></div>
      </div>
    </div>

    <div class="pane" id="detailpane">
      <header><span id="dtitle">Details</span></header>
      <div class="body" id="details"></div>
    </div>
  </div>

  <div id="console"></div>
</div>

<script src="s8data.js"></script>
<script>
"use strict";
const D = window.S8 || {};
const $ = s => document.querySelector(s);
const E = (t, c, x) => { const e = document.createElement(t);
  if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fx = (v, n = 3) => (v == null || !isFinite(v)) ? "—" : (+v).toFixed(n);
const ct = (v, n = 2) => (v == null || !isFinite(v)) ? "—" : (1e4 * v).toFixed(n);
const sci = (v, n = 3) => (v == null || !isFinite(v)) ? "—" : (+v).toExponential(n);
const cm = v => (v == null) ? "—" : (+v).toLocaleString("en-US");

/* ------------------------------------------------------------------ console */
const LOG = [];
function log(msg, cls) {
  const t = new Date().toTimeString().slice(0, 8);
  LOG.push([t, msg, cls]);
  const c = $("#console"); const d = E("div");
  d.appendChild(E("span", "t", t + "  "));
  const s = E("span", cls || "", msg); d.appendChild(s);
  c.appendChild(d); c.scrollTop = c.scrollHeight;
  while (c.children.length > 260) c.removeChild(c.firstChild);
}

/* ------------------------------------------------------ geometry definitions */
const GEOM = {
  ribes: {
    label: "RIBES wind-tunnel wing", span: 1.600, root: 0.5998, tip: 0.4199,
    sweep: 1.286, dihedral: -0.138, twist: 0.0, sref: 0.815, mac: 0.5153,
    section: "ribes", measured: true,
    note: "Planform fitted to 17 laser-scanned sections; residual 0.72 mm on the " +
          "leading edge against a 600 mm root chord. Reference area is the value " +
          "the RIBES report forms its own coefficients with."
  },
  m6: {
    label: "ONERA M6", span: 1.1963, root: 0.8059, tip: 0.4530,
    sweep: 30.0, dihedral: 0.0, twist: 0.0, sref: 0.7532, mac: 0.6460,
    section: "n0012", measured: false,
    note: "Canonical validation wing. The section here is a NACA 0012 stand-in: " +
          "the true ONERA D section is not carried in this bundle."
  },
  aeris: {
    label: "AERIS g83 (design set)", span: 2.400, root: 0.900, tip: 0.360,
    sweep: 22.0, dihedral: 2.0, twist: -2.0, sref: 1.512, mac: 0.900,
    section: "n4412", measured: false,
    note: "Reference chord 0.900 m and the mission condition are the governed " +
          "values. The planform numbers here are editable placeholders — the " +
          "g83 loft itself is not carried in this bundle, so treat the span, " +
          "sweep and twist shown as a starting point, not as the design record."
  }
};

/* ---------------------------------------------------------- section sources */
function naca4(m, p, t, n = 240) {
  const xs = [], zu = [], zl = [];
  for (let i = 0; i < n; i++) {
    const x = 0.5 * (1 - Math.cos(Math.PI * i / (n - 1)));
    const yt = 5 * t * (0.2969 * Math.sqrt(x) - 0.1260 * x - 0.3516 * x * x
                        + 0.2843 * x ** 3 - 0.1015 * x ** 4);
    let yc = 0, dy = 0;
    if (m > 0) {
      if (x < p) { yc = m / (p * p) * (2 * p * x - x * x); dy = 2 * m / (p * p) * (p - x); }
      else { yc = m / ((1 - p) ** 2) * ((1 - 2 * p) + 2 * p * x - x * x);
             dy = 2 * m / ((1 - p) ** 2) * (p - x); }
    }
    const th = Math.atan(dy);
    xs.push(x); zu.push(yc + yt * Math.cos(th)); zl.push(yc - yt * Math.cos(th));
  }
  return { x: xs, zu, zl };
}
const SECTIONS = {
  ribes: () => ({ x: D.section.x.slice(), zu: D.section.zu.slice(),
                  zl: D.section.zl.slice(),
                  label: "RIBES measured (CST n=8 on the cleaned scan)" }),
  n0012: () => Object.assign(naca4(0, 0.4, 0.12), { label: "NACA 0012 (stand-in)" }),
  n4412: () => Object.assign(naca4(0.04, 0.4, 0.12), { label: "NACA 4412 (stand-in)" })
};

/* --------------------------------------------------------------- mesh maths */
// geometric spacing: n cells, first cell s0, total length L -> growth ratio
function growthRatio(n, s0, L) {
  if (n < 2) return 1;
  if (s0 * n >= L) return 1;
  let lo = 1.0000001, hi = 3;
  const f = g => s0 * (Math.pow(g, n) - 1) / (g - 1) - L;
  if (f(hi) < 0) return hi;
  for (let k = 0; k < 80; k++) { const m = 0.5 * (lo + hi);
    if (f(m) > 0) hi = m; else lo = m; }
  return 0.5 * (lo + hi);
}
// spacing graded geometrically between two end spacings, normalised to length 1
function gradedT(n, ds0, ds1) {
  const h = [];
  for (let i = 0; i < n - 1; i++) {
    const u = (n === 2) ? 0 : i / (n - 2);
    h.push(Math.pow(ds0, 1 - u) * Math.pow(ds1, u));
  }
  const tot = h.reduce((a, b) => a + b, 0);
  const t = [0];
  for (const v of h) t.push(t[t.length - 1] + v / tot);
  t[t.length - 1] = 1;
  return t;
}
function arclen(px, pz) {
  const s = [0];
  for (let i = 1; i < px.length; i++)
    s.push(s[i - 1] + Math.hypot(px[i] - px[i - 1], pz[i] - pz[i - 1]));
  return s;
}
function resample(px, pz, s, targets) {
  const out = [];
  let j = 0;
  for (const st of targets) {
    const q = st * s[s.length - 1];
    while (j < s.length - 2 && s[j + 1] < q) j++;
    const f = (s[j + 1] - s[j]) < 1e-15 ? 0 : (q - s[j]) / (s[j + 1] - s[j]);
    out.push([px[j] + f * (px[j + 1] - px[j]), pz[j] + f * (pz[j + 1] - pz[j])]);
  }
  return out;
}
// nose radius from z ~ sqrt(2 R x)
function noseRadius(sec) {
  let num = 0, den = 0;
  for (let i = 1; i < sec.x.length; i++) {
    const x = sec.x[i]; if (x <= 1e-6 || x > 0.01) continue;
    const r = Math.sqrt(x), h = 0.5 * (sec.zu[i] - sec.zl[i]);
    num += r * h; den += r * r;
  }
  return den > 0 ? 0.5 * (num / den) ** 2 : 0.01;
}

/* build the closed ring: base face + upper + lower, with the blunt base */
function buildRing(sec, L, chord) {
  const teAbs = +L.te_abs_m || 0, teFrac = +L.te_floor_frac || 0;
  const tb = Math.max(teAbs / chord, teFrac);          // base opening, fraction of chord
  const have = sec.zu[sec.zu.length - 1] - sec.zl[sec.zl.length - 1];
  const add = Math.max(0, (tb - have) / 2);
  const zu = sec.zu.map((z, i) => z + add * sec.x[i]);
  const zl = sec.zl.map((z, i) => z - add * sec.x[i]);

  const R = noseRadius({ x: sec.x, zu, zl });
  const dsLE = clamp(R * (+L.target_le_turn_deg) * Math.PI / 180, 2e-6, 0.05)
               / (+L.le_refine_factor || 1);
  const dsTE = Math.max(+L.ds_te_frac, 1e-6);

  const nSide = Math.max(4, Math.round(+L.n_side));
  const nBase = Math.max(2, Math.round(+L.n_base));

  // upper surface, TE -> LE  (reverse the LE->TE arrays)
  const ux = sec.x.slice().reverse(), uz = zu.slice().reverse();
  const lx = sec.x.slice(), lz = zl.slice();
  const su = arclen(ux, uz), sl = arclen(lx, lz);
  const tu = gradedT(nSide, dsTE, dsLE);
  const tl = gradedT(nSide, dsLE, dsTE);
  const up = resample(ux, uz, su, tu);      // TE -> LE
  const lo = resample(lx, lz, sl, tl);      // LE -> TE

  // base face, from lower TE up to upper TE
  const z0 = lz[lz.length - 1], z1 = uz[0];
  const base = [];
  for (let i = 1; i < nBase - 1; i++)
    base.push([1, z0 + (z1 - z0) * i / (nBase - 1)]);

  const ring = up.concat(lo.slice(1), base);   // closed, first == wrap of last
  return { ring, tb, R, dsLE, dsTE, nRing: ring.length,
           achievedTE: Math.hypot(ring[1][0] - ring[0][0], ring[1][1] - ring[0][1]),
           achievedLE: Math.hypot(up[nSide - 1][0] - up[nSide - 2][0],
                                  up[nSide - 1][1] - up[nSide - 2][1]) };
}

/* march the ring outward with smoothed normals -> the O-block cross-section */
function marchNormal(ring, L, chord, smoothIters) {
  const n = ring.length;
  const s0 = (+L.s0_frac) ;                       // fraction of chord
  const nLayer = Math.max(3, Math.round(+L.n_normal));
  const far = (+L.farfield_chords);
  const g = growthRatio(nLayer - 1, s0, far);
  const layers = [ring.map(p => p.slice())];
  let h = s0;
  const spac = [];
  for (let k = 1; k < nLayer; k++) {
    const prev = layers[k - 1];
    // outward normals
    let nx = new Float64Array(n), nz = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      const a = prev[(i - 1 + n) % n], b = prev[(i + 1) % n];
      let tx = b[0] - a[0], tz = b[1] - a[1];
      const m = Math.hypot(tx, tz) || 1; tx /= m; tz /= m;
      nx[i] = tz; nz[i] = -tx;                    // ring runs TE->LE on top
    }
    // smoothing is what makes the marching lines curve rather than cross
    const it = smoothIters == null ? 12 : smoothIters;
    for (let p = 0; p < it; p++) {
      const ax = new Float64Array(n), az = new Float64Array(n);
      for (let i = 0; i < n; i++) {
        const im = (i - 1 + n) % n, ip = (i + 1) % n;
        ax[i] = 0.25 * nx[im] + 0.5 * nx[i] + 0.25 * nx[ip];
        az[i] = 0.25 * nz[im] + 0.5 * nz[i] + 0.25 * nz[ip];
      }
      nx = ax; nz = az;
    }
    const layer = [];
    for (let i = 0; i < n; i++) {
      const m = Math.hypot(nx[i], nz[i]) || 1;
      layer.push([prev[i][0] + h * nx[i] / m, prev[i][1] + h * nz[i] / m]);
    }
    layers.push(layer); spac.push(h); h *= g;
  }
  return { layers, growth: g, spacings: spac, nLayer };
}

/* quality: signed quad areas, folded count, aspect ratios */
function quality(layers) {
  const nk = layers.length, n = layers[0].length;
  let neg = 0, amin = Infinity, amax = -Infinity, arMax = 0, tot = 0;
  const cellA = [];
  for (let k = 0; k < nk - 1; k++) {
    const row = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      const ip = (i + 1) % n;
      const p = [layers[k][i], layers[k][ip], layers[k + 1][ip], layers[k + 1][i]];
      let a = 0;
      for (let q = 0; q < 4; q++) {
        const u = p[q], v = p[(q + 1) % 4];
        a += u[0] * v[1] - v[0] * u[1];
      }
      a *= 0.5;
      row[i] = a;
      if (a <= 0) neg++;
      const aa = Math.abs(a);
      amin = Math.min(amin, aa); amax = Math.max(amax, aa); tot++;
      const w = Math.hypot(p[1][0] - p[0][0], p[1][1] - p[0][1]);
      const hh = Math.hypot(p[3][0] - p[0][0], p[3][1] - p[0][1]);
      if (w > 0 && hh > 0) arMax = Math.max(arMax, Math.max(w / hh, hh / w));
    }
    cellA.push(row);
  }
  return { neg, amin, amax, arMax, tot, cellA };
}

/* cell counts, matching how the blocks are actually dimensioned */
function blockCounts(L, nRing) {
  const nS = Math.round(+L.n_span), nN = Math.round(+L.n_normal);
  const nCap = Math.max(3, Math.round(+L.n_side) - Math.round(+L.n_cap_collar));
  const nBase = Math.round(+L.n_base);
  const g = growthRatio(60, (+L.s0_frac) * (+L.tip_span_first_cell_in_s0 || 2),
                        +L.farfield_chords);
  let nOut = 3, acc = 0, hh = (+L.s0_frac) * (+L.tip_span_first_cell_in_s0 || 2);
  while (acc < +L.farfield_chords && nOut < 400) { acc += hh; hh *= 1.28; nOut++; }
  const oWing = (nRing - 1) * (nN - 1) * (nS - 1);
  const oOut  = (nRing - 1) * (nN - 1) * (nOut - 1);
  const capOut = (nCap - 1) * (nBase - 1) * (nOut - 1);
  return { nRing, nN, nS, nOut, nCap, nBase,
           oWing, oOut, capOut, total: oWing + oOut + capOut,
           shapes: { o_wing: [nRing, nN, nS], o_out: [nRing, nN, nOut],
                     cap_out: [nCap, nBase, nOut] } };
}

/* y+ of the first cell, from a flat-plate skin friction estimate */
function yPlusEstimate(s0Frac, chord, Re) {
  if (!Re || !chord) return null;
  const cf = 0.026 / Math.pow(Re, 1 / 7);
  return s0Frac * chord * Re / chord * Math.sqrt(cf / 2);
}
</script>

<script>
/* ============================================================== app state */
const S = {
  stage: "geom", node: "planform",
  geom: "ribes",
  level: "gci2_C",
  L: Object.assign({}, D.levels ? D.levels.gci2_C : {}),

    useANKSolver: true, ANKSwitchTol: 1.0, useNKSolver: false, NKSwitchTol: 1e-6,
    ANKSubspaceSize: 10, NKSubspaceSize: 20, ANKPCILUFill: 1, NKPCILUFill: 1,
    L2Convergence: 1e-6, nCycles: 30000, timeLimit: 2100,

    turbulenceOrder: "first order", useFT2SA: true, useWallFunctions: false,
    useQCR: false, liftIndex: 3
  },
  cond: {
    name: "RIBES T40 measured", alpha: 0.36, mach: 0.11494, reynolds: 1.3286e6,
