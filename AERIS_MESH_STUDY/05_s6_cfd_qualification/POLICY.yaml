schema_version: aeris.s6.qualification.policy.v1
deletion_policy: explicit_human_approval_only
qualification_state: conditional_go_m2_resource_corrected_canary
classification_policy: policies/convergence_v2.yaml
heavy_work:
  blocked: true
  reason: >-
    All heavy work remains blocked. A fresh one-shot M2 A/C03 ILU-fill-corrected
    canary may become executable only after its independent review and preflight
    gates pass; the consumed v2 and v3 attempts remain permanently non-retryable.
  exceptions:
    run-canary:
      policy: policies/m2_a_c03_canary_v4.yaml
      maximum_process_launches: 1
      accepted_classification_allowed: false
      automatic_retry_allowed: false
    run-s8-first-point:
      policy: policies/s8_oh_first_point_v1.yaml
      decision: AERIS_MESH_STUDY/00_governance/decisions/ADR-0018-s8-oh-structured-grid.md
      authorized_by: principal_investigator
      authorized_on: 2026-09-03
      scope: >-
        The first CFD point on the S8 O-H grid, on lhs100_seed42[83] at the
        nominal mission operating point. Authorizes measurement of surface
        pressure against its physical bound. Does NOT authorize tip-cap viscous
        quantities, a family freeze, a hold-out unlock, or any paper claim.
      minimum_mpi_processes: 6
    run-s8-corrected-sweep:
      policy: policies/s8_oh_corrected_sweep_v1.yaml
      decision: AERIS_MESH_STUDY/00_governance/decisions/ADR-0019-s8-lift-axis-and-le-spacing.md
      authorized_by: principal_investigator
      authorized_on: 2026-09-04
      authorization_note: >-
        Directed in session; see the how_given field of the policy file for how
        the decision was given and by what route it reached this record.
      scope: >-
        The corrected alpha sweep on the rebuilt S8 oh_L3 grid, on
        lhs100_seed42[83] at the nominal mission operating point, after defect
        14 (lift axis) and defect 15 (spanwise leading-edge spacing) were
        fixed. Authorizes lift-curve measurement and a repeat of the
        surface-pressure bound check. Does NOT authorize tip-cap viscous
        quantities, grid convergence, a family freeze, a hold-out unlock, or
        any paper claim.
      alpha_deg: [-2.0, 0.0, 4.0, 8.0]
      minimum_mpi_processes: 6
    run-s8-campaign:
      policy: policies/s8_campaign_v1.yaml
      decision: AERIS_MESH_STUDY/00_governance/decisions/ADR-0020-s8-desktop-campaign.md
      plan: AERIS_MESH_STUDY/04_strategy_studies/S8_oh_structured/PLAN_desktop_campaign.md
      authorized_by: principal_investigator
      authorized_on: 2026-09-06
      authorization_note: >-
        Directed in session; see the how_given field of the policy file for how
        the decision was given and by what route it reached this record.
      scope: >-
        Grid refinement on lhs100_seed42[83] at the two levels this host can
        hold, one far-field sensitivity run, the ten-geometry pilot, and the
        ONERA M6 solver validation. Authorizes a refinement TREND and not a
        grid-convergence index: the third level does not fit on any machine
        available here, and PLAN section 2.1 requires that limitation be stated
        rather than worked around. Does NOT authorize a hold-out unlock, a
        family freeze, a design-space campaign beyond the ten pilot geometries,
        or any paper claim.
      geometry_indices: [12, 13, 16, 23, 29, 36, 47, 65, 81, 83]
      grid_levels: [gci_C, gci_M]
      alpha_deg: [-2.0, 0.0, 4.0, 8.0]
      minimum_mpi_processes: 6
    run-s8-cloud-hf:
      policy: policies/s8_cloud_hf_v1.yaml
      decision: AERIS_MESH_STUDY/00_governance/decisions/ADR-0020-s8-desktop-campaign.md
      plan: AERIS_MESH_STUDY/04_strategy_studies/S8_oh_structured/reports/s8_cloud_batch.json
      authorized_by: principal_investigator
      authorized_on: 2026-09-09
      authorization_note: >-
        Directed in session after the ten-geometry generalization completed:
        "ok proceed. make it cloud ready." Written into the record by the agent
        that was directed, not typed by the principal investigator.
      scope: >-
        The high-fidelity batch on rented compute: gci_F on the ten authorized
        pilot geometries and gci_FF on the reference geometry, four incidences
        each, plus the mesh builds those require. Authorizes the grid levels the
        desktop cannot hold, which is the whole reason for renting. Does NOT
        authorize a hold-out unlock, a family freeze, geometries outside the
        authorized ten, a solver other than the one validated against ONERA M6,
        or any paper claim.
      geometry_indices: [12, 13, 16, 23, 29, 36, 47, 65, 81, 83]
      grid_levels: [gci_C, gci_M, gci_F, gci_FF]
      alpha_deg: [-2.0, 0.0, 4.0, 8.0]
      minimum_mpi_processes: 6
      preflight_required: true
      preflight_reason: >-
        cloud_preflight.py must pass on the rented host before any solve. Every
        failure it checks for is one this project has actually hit, and on
        rented compute each of them bills.
holdout:
  id: round_c_lhs10_seed42
  locked: true
  unlock_requires: valid_freeze_manifest_and_m8_gate
execution:
  immutable_records: true
  atomic_outputs: true
  retain_large_artifact_hashes_only: true
