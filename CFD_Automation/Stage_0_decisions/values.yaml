# Stage 0 starting values. Explained in decisions.md. Updated 6 Nov 2026, evening.
# Only decided values are values. Items not decided yet sit next to them as `proposal:` notes (pending) or comments.
drag_count: 0.0001

D1_accuracy:
  increment_target:
    value: {dCD: 2, dCL: 0.005}
    unit: {dCD: drag counts, dCL: "-"}
    reason: Wings differ by a few drag counts, so the target must sit below that. Shared mesh errors cancel in the difference. Since 2 Nov 2026 (Stage 1) a numerical target only (mesh + iterations); SA's own error on differences is 4 counts median (2-D strips).
    sources: [morrison2014dpw]
  absolute_budget_CD:
    value: "max(0.03*CD, 3 counts)"
    reason: Independent expert codes spread by about 5 counts on the same wing; one verified workflow must do better, or its band is too wide to use.
    sources: [levy2013dpw]
  absolute_budget_CL:
    value: "max(0.01*CL, 0.005)"
    reason: About the same relative size as the drag budget.
    sources: []   # our choice
  absolute_budget_CM:
    value: 0.002
    reason: Starting value.
    sources: []   # our choice; still open (open decision 3)
  grid_split_by_direction:
    value: {chordwise: 35, spanwise: 15, wall_normal: 20, edges_and_base: 15, wake: 15}
    unit: percent of the grid part
    reason: Gives each mesh study a share to stop against. A plan, revised after the first error map.
    sources: []   # our choice
  other_error_terms:
    value: {iterative_max: 10, domain_max: 10, numerical_settings_max: 15}
    unit: percent of the total
    reason: Keeps every error source bounded. Celik asks iterative error >= 1 order below grid error; Eca & Hoekstra ask 2-3 orders. The D3 stopping rule meets the iterative share (0.12 counts measured < 0.3 allowed).
    sources: [celik2008, eca2006iterative]   # iterative share still open (open decision 4)
  grid_share_of_total:
    value: 65
    unit: percent of the total
    reason: "100 - 10 - 10 - 15."
    sources: []   # still open (open decision 1)
  mesh_starting_values:   # the "starting value" column of the D1 table
    chordwise:
      edge_cells_c: 0.001          # leading and trailing edge, x local chord (DPW)
      # Since Stage 2 the transition band also sets cells along the chord (see D3 turbulence_model).
    spanwise:                      # Stage 2 (2 Nov 2026), decision 62; the first start was 0.1 % of semi-span at root and tip (DPW)
      station_on_every_loft_station: true   # so a station on every break
      station_gap_c: 0.20          # x local chord, as built in Stage 2
      station_gap_c_at_M: 0.25     # x local chord; owner, 6 Nov 2026 (lighter rules)
      min_gaps_per_panel: 12
      growth: 1.2
      tip_gap: 2 x s0              # owner, 6 Nov 2026 (lighter rules); was the tip first wall cell (s0), the tip squeeze
    wall_normal:
      first_cell_yplus: 1          # y+ <= 1 at VC, a hard minimum (owner, 6 Nov 2026)
      growth_max: 1.25             # at VC, a hard minimum (owner, 6 Nov 2026)
      growth_at_F: 1.107           # owner, 6 Nov 2026: 1.25 at VC, about 1.30x wall layers per level; just above the 1.1 a transition model asks for; 1.23 at VC would give exactly 1.1 (Stage 2 decision 57; Ansys CFX guidance)
    edges_and_base:
      edge_cells_c: 0.001
      base_cells: {C: 8, M: 10, F: 14, FF: 18}   # Stage 2 decision 61; even counts, so the steps are 1.25, 1.4, 1.29
    wake:
      value: >-
        One matched C-H multiblock mesh for ADflow and SU2, instead of the overset wake box and vortex tube
        (SU2 has no overset and refuses structured CGNS; converted to unstructured hexes, it runs). Rules set in the mesh stage.
      # owner, 6 Nov 2026. The wake lines may add about +45 % (30-60 %) cells on the wing blocks (rough count).
    outer_boundary:
      dpw_reference_chords: 100
      start_chords: 80             # the project's starting value
      ladder_chords: [40, 80, 160]
      reason: 40 -> 60 chords moved drag 0.6-0.7 counts in earlier AERIS tests, so 40 is too close.
    sources: [levy2013dpw, ansys_cfx_transition]
  turbulence_model_error:
    value: own band, never inside the grid budget
    reason: Mesh error and model error are different things.
    sources: [asme2009vv20]

D2_wings_and_sets:
  wing_types:
    value: {tailless: [bwb, flying_wing], conventional: [cranked, tapered]}
    n_variables: {bwb: 17, cranked: 17, flying_wing: 13, tapered: 13}
    reason: Stage 1 closed 2 Nov 2026 with four types in two families; 730 of 730 sampled wings build.
    sources: []
  reference_wings:
    value: [all mid-range, smallest area, largest area, most sweep + smallest tip chord, strongest twist]
    unit: 5 per wing type
    reason: Few enough to study in depth, spread enough to show how mesh needs change. Fixed before any mesh.
    sources: []
  reference_coverage_check:
    value: coverage <= median of 1000 random sets of five
    unit: "coverage = largest distance from a training wing to its nearest reference wing, variables in [0, 1]"
    reason: Shows the five are spread out, not clustered.
    sources: [johnson1990minimax]
  training_set:
    value: {name: training_focus, wings_per_type: 100, design: latin_hypercube, seed: fixed, space: focus}
    full_space: {name: training_full, wings_per_type: 40}
    reason: Spreads wings evenly over all variables at once.
    sources: [mckay1979lhs]
  corner_set_part1:
    value: "2 * n_variables (each variable at each bound, others mid-range)"
    count: {bwb: 34, cranked: 34, flying_wing: 26, tapered: 26}   # set corner1, as built in Stage 1
    count_with_similarity: {bwb: 32, cranked: 32, flying_wing: 24, tapered: 24}   # owner, 6 Nov 2026: the root chord leaves the design vector, 2 per free variable; being built in the Stage 1 code now
    reason: Shows where each variable alone breaks the mesh rules.
    sources: []
  corner_set_part2:
    value: "smallest N with C(N-1, ceil(N/2)) >= n_variables; N = 8 for 17 variables, N = 7 for 13"
    count: {bwb: 8, cranked: 8, flying_wing: 7, tapered: 7}   # set corner2
    reason: Every pair of variables at all four low/high combinations, at the lowest cost.
    sources: [katona1973, kleitman1973]
  holdout_set:
    value: {name: holdout_focus, wings_per_type: 10, design: latin_hypercube, seed: different, opened: once at the end}
    full_space: {name: holdout_full, wings_per_type: 5}
    reason: The only honest test on wings the rules were not tuned on.
    sources: [dwork2015science, dwork2017cacm]
  robustness_claim:
    value: {failures: 0, min_wings: 150, success_rate: ">= 0.98", confidence: 0.95}
    reason: "1 - 0.05^(1/150) = 1.98 % upper bound on failure rate. Per type, the built sets give 187 wings (bwb, cranked) or 178 (flying_wing, tapered); the hold-outs (10 + 5) run once at the end. The focus sets alone give 105 (115 with the focus hold-out), below 150, so the claim needs the full-space sets too."
    sources: [hanley1983]

D3_conditions_and_measurement:
  mach_max:
    value: "open; the scope extends toward 0.5"   # owner, 4 Nov 2026 (was 0.3)
    supersonic_flow: none          # no supersonic regime or phenomena, not even small pockets (owner, 4 Nov 2026)
    stage1_data_max: 0.2           # Stage 1 section tables at Mach 0, 0.1 and 0.2
    solve_mach: 0.1                # owner, 6 Nov 2026 (similarity): Prandtl-Glauert correction on CL and CM
    reason: The owner's scope. The focus wings fly at Mach 0.03-0.2.
    proposal: >-
      Pending: core data at Mach <= 0.2 now; Mach 0.3-0.5 later with a fast-UAV family (real fast UAVs,
      thinner sections, section tables to Mach 0.5). At Mach 0.5 angles capped near 4 deg by a
      supersonic-pocket gate (2-D estimate: pockets from 5.5-6.5 deg at Mach 0.5, 8-9.5 deg at 0.4, only
      near stall at 0.3).
    sources: []
  reynolds_levels:
    value: [1.0e5, 3.0e5, 1.5e6, 3.0e6]
    unit: on the mean chord = area / full span (not the MAC, which on a BWB is 1.09-2.06x larger; the code has always used area / span)
    reason: >-
      Level 1e5 added on 30 Oct 2026 (Mike): real Class I wings fly at 1.2-3e5 (Black Swift S0, eBee)
      and the focus space reaches 8e4; 3e5 missed that decade. Tips (1-2e4) get no level: no RANS
      model is reliable there.
      Top level lowered from 5e6 to 3e6 on 29 Oct 2026 (the highest real value, 2.74e6 for the RUAG Ranger at
      top speed, rounded up). Real Class I-II wings with a published
      wing area fly at Re 1.2e5 to 2.1e6 (highest: AAI Pioneer at top speed, sea level); none in our
      families reaches 5e6 (Stage_1_geometry/configs/real_uavs.yaml, Stage_1_geometry/docs/real_uavs.json). The
      Class II wings with a published area (Goetten et al. 2021; Essari 2015 thesis, Jane's-style data:
      Hermes 450, Ranger, Seeker, Shadow 600) have mean chords 0.55-0.66 m and reach Re 2.1-2.7e6 at top
      speed, sea level.
      Mini Class I sit below 3e5: covered by the 1e5 level since 30 Oct 2026.
      Since 31 Oct 2026 (decision 49; Stage 1 closed 2 Nov) real Class I-II wings with a published area fly at
      Re 1.2e5 to 3.1e6. The top is the NTNU Aludra MK1 row at its listed top speed (3.1e6; area from full
      span and aspect ratio), 3 % above the top level; its listed chord (0.60 m) disagrees with full span / AR
      (0.74 m). Levels unchanged.
    input: Re on the mean chord, so every shape runs at all four levels   # owner, 6 Nov 2026 (similarity)
    proposal: "Pending: the Re levels; check C4 adds a level near 7e5-1e6 only if needed."
    sources: [nato2009jcguav, icao1993isa, sutherland1893]
  similarity:   # owner, 6 Nov 2026; being built in the Stage 1 code now (all hashes change)
    value:
      reference_length: unit mean chord
      input: Re on the mean chord
      mach: 0.1                    # Prandtl-Glauert correction on CL and CM
      trailing_edge_c: 0.002
      tu_percent: 0.07             # N_crit 9
      temperature_K: 288.15
      gamma: 1.4
      prandtl: 0.71
      wall: adiabatic
      design_vector: "root chord leaves the vector (18 -> 17 numbers)"
      meshes_per_wing: {before: 21, with_similarity: 4}
      dataset_solves: {before: 42000, with_similarity: 8000, angles: 5, with_about_8_angles_from_minus5_to_stall: 12800}   # the angle steps are still pending
      corner_set_part1: {bwb: 32, cranked: 32, flying_wing: 24, tapered: 24}   # was 34 / 26
      checks: [C1 scale, C2 Mach, C3 trailing edge, "C4 Re-level interpolation (add a level near 7e5-1e6 only if needed; still pending)"]
    reason: CL, CD and CM depend on shape, Re and Mach, not on the size itself. Limit - Re does not carry surface roughness or air turbulence.
    sources: [anderson2011]
  angles_of_attack:
    value: {range_deg: "-5 to post-stall", steady_rans: up to stall onset, post_stall_study: URANS or DDES on a few wings}   # owner, 6 Nov 2026
    was: {all: [0, 4, 8], leading_edge_and_wake: [0, 4, 8, 12]}   # until 6 Nov 2026
    unit: deg
    reason: Cruise, climb, high lift and negative angles. The nose needs finer cells at high angle; at negative angles the lower surface becomes the suction side. The Stage 1 dataset covers root angles 0-10 deg only.
    proposal: {mesh_studies_deg: "-5, 4 and the highest steady angle", dataset: "-5 to stall in about 2.5 deg steps (about 8 angles)"}   # pending
    sources: []
  quantities_watched:
    value: [CL, CD_pressure, CD_friction, CD, CM, neutral_point, cp_at_sections, y_plus]
    reason: A study passes only if it passes on all of them at every angle.
    sources: []
  mesh_family:
    value: {min_levels: 3, min_refinement_ratio: 1.3}
    built_stage2: {levels: [C, M, F, FF], every_spacing_divided_by: 1.3, checked_within_percent: 3}   # the base cells are the one exception (D1)
    levels:   # owner, 6 Nov 2026
      names: [VC, C, M, F]
      where: {VC: desktop, C: university HPC, M: university HPC, F: university HPC}
      hard_minimums_at_VC: [y+ <= 1, growth <= 1.25, base >= 8 cells, no kinks, tip gap]
      accuracy_targets_at_M: [nose 10 deg, trailing edge 0.1 % c, station gap, largest cell 2 % c]   # as DPW defines its medium grid
      transition_targets_at_F: [about 20 cells per bubble]
      cells_per_level: "about 2.2x (every spacing / 1.3)"
      wall_layers_per_level: about 1.30x
      lighter_rules:               # owner, 6 Nov 2026
        band_cell_c_at_F: 0.005    # where local Re >= 4e5: the bubble-length table stops at 0.10 c from local Re 4e5 up
        tip_gap: 2 x s0
        station_gap_c_at_M: 0.25   # x local chord
    reason: Fewer than three meshes give a trend, not an error estimate.
    # Cost (estimates, Stage 2; surface x wall layers, 20 reference wings x 4 Re): fine level about 10-11 M cells median on
    # the wing blocks (10.9 M with the band change; 15.2 M with the planned rules; the proposal said F at about 9-11 M).
    # The C-H wake lines may add about +45 % (30-60 %, rough). Desktop limit about 1.2 M cells (with F at 10.9 M, C is
    # about 2.3 M: above it).
    sources: [celik2008, dpw4_gridding]
  error_estimate:
    value: {method: GCI, safety_factor: 1.25, if_scatter: least_squares}
    reason: Standard published procedure.
    sources: [celik2008, roache1994, eca2014]
  oscillating_results:
    value: no error estimate; investigate
    reason: Oscillation means the meshes are not yet where the estimate holds.
    sources: [celik2008]
  stopping_rule:
    value:
      residual_target: 1.0e-6          # ADflow L2Convergence, relative to the freestream residual
      forces_settled: {CL_rel: 0.0005, CD_rel: 0.001, CM_abs: 1.0e-4}
      min_orders_drop_every_equation: 3
      fallback: {residual_orders_drop: 5, forces_settled: true, outcome: accepted}
      otherwise: needs_review
      caps: {iterations: 30000, wall_time_h: 6}
      solver_exit_code_used: false
    reason: A low residual alone does not prove the forces stopped moving; the turbulence equation can stall while the flow equations fall. Measured past 1e-6, CD moves at most 0.12 counts, inside the 0.3-count iterative share.
    sources: [celik2008, adflow_options]
  one_change_per_run:
    value: one setting changes between compared runs; the wing never changes in a mesh study
    reason: Otherwise the cause of a difference cannot be named.
    sources: []
  turbulence_model:
    value: transition must be captured, with ADflow and SU2 (owner, 4 Nov 2026); transition from SU2 (SST + LM gamma-Re_theta), because our ADflow build has SA only (SST aborted) and no transition model; every drag number carries a model band
    was: SA for mesh studies now; final model and SA inflow value in a later stage (by G0, decision 54)   # superseded 4 Nov 2026
    transition_ready_mesh: {yplus_max: 1, min_cells_across_bl: 30, band_upper_c: [0.0, 0.85], band_lower_c: [0.60, 1.00], upper_band_from_le: every wing, band_cell: bubble length / 20 at level C}
    # First approach: the band as built in Stage 2 (decisions 56, 58). Stage 1 asked band_upper_c [0.10, 0.85], from the leading edge on swept panels only.
    # SA inflow value (nu~/nu about 3): still to fix and record, before the first ADflow solve.
    transition_targets_at_F:       # owner, 6 Nov 2026 (mesh levels)
      cells_per_bubble: about 20   # at level F, instead of at level C as built (Ansys CFX: 20 nodes per bubble, wall-normal growth about 1.1, y+ about 1, 75-100 nodes leading to trailing edge)
      wall_normal_growth: 1.107    # 1.25 at VC; just above the 1.1 a transition model asks for; 1.23 at VC would give exactly 1.1 (Stage 2 decision 57)
      band_cell_c_where_local_Re_ge_4e5: 0.005   # the bubble-length table stops at 0.10 c from local Re 4e5 up
      lower_band_c: [0.0, 1.0]     # owner, 7 Nov 2026 (Stage 2 decision 74, option A): from the leading edge; no extra cells (shared node list)
      upper_band_c: [0.0, 1.0]     # proposal, pending (7 Nov 2026): the refine map at the Re levels puts the upper transition past 85 % c at low Re
                                   # (Re 1e5: 0-31 % of strips fit 0-85 % c); the built mesh already has band cells to 100 % c on both sides
                                   # (shared node list, lower band 0-100 % c), so writing it changes no mesh (was 0-85 % c)
    proposal:   # pending
      solver_split: ADflow SA for all mesh studies and the fully turbulent data; SU2 SST + LM on about 20 % of the wings first
    # SU2 smoke test (4 Nov 2026), not a result: SU2 8.6.0, SA and LM on one Stage 2 ring mesh (a section extruded
    # between two symmetry planes, 97,920 cells, Re 3e5, Mach 0.15, 4 deg); after about 370 iterations, not converged:
    # SA CL 0.860, CD 0.0184; LM CL 0.908, CD 0.0137. Shows the mesh path works; no wing has been run.
    reason: Stage 1 (2-D XFOIL strips) found long laminar runs and bubbles; fully turbulent SA overpredicts profile drag by a median +62 % (+69 % in level flight). What the mesh must resolve depends on the model.
    sources: [spalart2007, crivellini2014, ansys_cfx_transition]   # plus the Stage 1 flow study

D4_working_rules:
  mesh_name: {value: "mesh_<level>_<wing_hash8>_re<Re>", reason: "One name means one mesh. Re on the mean chord: one surface per wing and Re level, because the tip gap and the band cells depend on Re (Stage 2 decision 59). Not family: that word means the wing families."}
  run_outcomes: {value: [accepted, rejected, needs_review], reason: Countable results.}
  failures_counted: {value: failures stay in every count, reason: Otherwise success rates inflate.}
  thresholds_first: {value: thresholds written before results, reason: No tuning the test to the answer., sources: [nosek2018]}
  holdout_once: {value: hold-out opened once at the end, reason: See D2., sources: [dwork2015science]}
  trial_vs_final: {value: trial-mesh results kept apart from final results, reason: Only the frozen setup is evidence.}
  figures_from_scripts: {value: every figure and table built by a script from stored data, reason: Anyone can rebuild it.}
