# Stage 2 — surface mesh rules: the new approach (decisions 71, 72, 74; decided 6–7 Nov 2026, built 7 Nov 2026).
# Every value here is read by cfdauto/mesh/laws.py, which turns it into one function per setting (input: the wing,
# the flow, the level; output: the setting, and Rules.reason(name) says why it has that value).
# Anchors (decision 71): a value written {value: x, at: LEVEL} is met at LEVEL and follows the family rule on the
# other levels. For level k and anchor a (VC = 0, C = 1, M = 2, F = 3): spacings and angles x · 1.3^(a − k);
# counts x · 1.3^(k − a) (the base rounded to an even count, the gaps per panel rounded up); growth x^(1.3^(a − k)).
# Hard minimums at VC, accuracy targets at M, transition targets at F. The plain numbers here are the same at
# every level. The first approach (2–3 Nov, every rule met at C, the coarsest): configs/surface_first.yaml.
# "law n" = the row of the laws table in the Grand Roadmap (Annex G, section 04).

levels:
  names: [VC, C, M, F]            # level k = 0, 1, 2, 3; the same places on the ladder as the first C, M, F, FF.
                                  # VC on the desktop; C, M, F on the university HPC (decision 71)
  ratio: 1.3                      # r >= 1.3 in every direction and every spacing (law 23; Celik et al. 2008)

chord:                            # around the section (one closed ring per station)
  nose_turning_deg: {value: 10.0, at: M, why: "accuracy target, decision 71"}
                                  # law 1: no ring cell turns the surface by more than this: 16.9° at VC, 13° at C,
                                  # 10° at M, 7.7° at F (each level is checked against its own angle)
  nose_solved_at: [VC, C, M, F]   # the nose spacing is solved by bisection at every level, each for its own angle
                                  # (16.9, 13, 10, 7.7°) on its own ring, the finest first; each answer is moved to VC
                                  # (x 1.3^k), the smallest (strictest) wins and every level takes it ÷ 1.3^k, so every
                                  # level meets its own angle and the family rule stays exact. A coarser level starts
                                  # from the finer answer and is solved only if that misses its own angle. With VC and F
                                  # only (7 Nov, first build), M missed 10° on the flying wings and needed a repair
                                  # (nose x 0.9), which broke the ratio there. decisions/surface_rules.md, sections 13-14
  nose_turning_tol_deg: 0.02
  nose_envelope: 1.15             # law 2: nose spacing / chord may change by at most this between stations (a check;
                                  # one node distribution for the whole wing makes it hold by construction)
  te_spacing_c: {value: 0.001, at: M, why: "accuracy target, decision 71; DPW, Levy et al. 2013"}
                                  # law 3: 0.1 % of local chord at the trailing-edge corners at M (0.169 % c at VC)
  base_cells: {value: 8, at: VC, why: "hard minimum, decision 71"}
                                  # law 6: cells across the blunt base: 8, 10, 14, 18 at VC, C, M, F (must stay even)
  growth: {value: 1.20, at: VC, why: "hard minimum, decision 71"}
                                  # growth used to build the size field: 1.2 at VC, 1.15 at C, 1.11 at M, 1.087 at F
  growth_limit: {value: 1.25, at: VC, why: "hard minimum, decision 71; Stage 1 handover; DPW"}
                                  # check: neighbouring cells along the ring: 1.25 at VC, 1.19 at C, 1.14 at M, 1.11 at F
  max_spacing_c: {value: 0.02, at: M, why: "accuracy target, decision 71; our starting value"}
                                  # largest cell outside the band: 2 % c at M (3.38 % c at VC)
  transition_band: true           # the band switch (9 Nov 2026): kept true for every run, SA and LM alike (owner,
                                  # decision 81: one mesh family for both solvers). false = no band, the largest cell
                                  # above only: not used (with it off the BWB tip cap fails at M, Study 13). Also on the
                                  # command line: --band on|off (the mesh name gets _noband). Rules frozen (decision 82).
                                  # Cost at F, 20 reference wings (Study 13): on / off = 1.08x the cells at Re 1e5,
                                  # 1.83x at 3e5, 1.91x at 1e6 and at 4e6
  band_upper: [0.0, 1.00]       # transition band, upper surface, x/c, from the leading edge (owner, 8 Nov 2026; was
                                  # 0-85 % c, decision 58). At low Re the upper transition sits past 85 % c (refine map by
                                  # Re level: at 1e5 0-31 % of the strips fit 0-85 % c). The built mesh already had
                                  # band-size cells there (one node list for both sides, decision 60); now the rule says
                                  # so. Cost measured on 7 Nov: the same mesh at VC, +2 ring nodes at F on 42 of 80
                                  # reference builds, +0.39 % cells (data/studies/upper_band_check.json)
  band_lower: [0.0, 1.00]         # lower surface, x/c: from the leading edge, for angles down to −5° (decision 74,
                                  # option A, 7 Nov). It costs no cells: both sides share one node list (decision 60)
                                  # and the upper band already makes the front of the lower side fine (Study 8)
  nodes_per_bubble: {value: 20, at: F, why: "transition target, decision 71; Ansys CFX guide, decision 56"}
                                  # band cell = bubble length / 20 at F: 9.1, 11.8, 15.4, 20 cells per bubble at VC, C, M, F
  bubble_length:                  # bubble length / chord against local Re (Stage 1, 2-D XFOIL, N_crit 9);
                                  # log-log between the points, constant outside them; floor 0.10 c from 4e5 (decision 72)
    re:  [6.0e4, 1.0e5, 4.0e5, 1.0e6]
    l_c: [0.40,  0.30,  0.10,  0.10]

span:                             # along the semi-span (stations)
  spacing_c: {value: 0.25, at: M, why: "accuracy target, decisions 71, 72"}
                                  # law 8: target station gap 0.25 x local chord at M: 0.4225, 0.325, 0.25, 0.192 at VC, C, M, F
  min_cells_per_panel: {value: 12, at: M, why: "accuracy target, decision 71"}
                                  # at least this many gaps between two loft stations at M: 8, 10, 12, 16 at VC, C, M, F.
                                  # Each panel gets a whole number of gaps, so the gaps on the two sides of a break can
                                  # differ by up to one gap in the panel's count
  growth: {value: 1.20, at: VC, why: "first approach's value, unchanged"}
                                  # used to build the size field (as on the ring)
  growth_limit: {value: 1.30, at: VC, why: "Stage 1 handover; unchanged"}
                                  # check: neighbouring station gaps: 1.3 at VC, 1.22 at C, 1.17 at M, 1.13 at F
  tip_gap_in_s0: 2.0              # law 9/10: last gap at the tip = 2 x tip first cell s0 at every level (decision 72);
                                  # s0 itself follows the level's y+ below

wall:                             # first cell, needed here only for the last gap at the tip (law 13)
  yplus: {value: 1.0, at: VC, why: "hard minimum, decision 71"}
                                  # y+ = 1 at VC: 0.77, 0.59, 0.46 at C, M, F
  # s0 / c = y+ / (Re_c * sqrt(Cf / 2)),  Cf = 0.026 Re_c^(-1/7)  (turbulent flat plate, White 2006)

sampling:
  dense_per_side: 6001            # dense points per surface, cosine spaced in x/c (clusters at the nose and the TE)
  dense_span: 4001
  cap_smoothing: 400              # Laplacian sweeps on the tip cap, edges held (S8)

checks:
  on_loft_m: 1.0e-9               # every node on the loft
  tip_gap_band: [0.8, 1.01]       # delivered last gap / asked: at most 1 % larger, at most 20 % smaller (integer counts)
  min_scaled_jacobian: 0.05       # surface quads (wing and cap); <= 0 is a folded quad
