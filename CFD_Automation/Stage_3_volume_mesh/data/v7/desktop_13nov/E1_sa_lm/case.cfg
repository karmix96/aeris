% AERIS 13 Nov desktop plan, block E: Eppler 387, alpha 2 deg, Re 2e5 (McGhee, NASA TM-4062), 2-D, on the SU2 (SA + LM)
% recipe of the SU2 study (inc_sa_recipe.cfg: incompressible, FDS, Venkatakrishnan 0.05 frozen after 500
% iterations, CFL adaptive capped at 50). S8's grid (ogrid_e387.su2, SU2's Langtry-Menter tutorial) and S8's
% conditions: Mach 0.06 (the tutorial's; incompressible here: rho, |V|, mu from it), alpha 2 (McGhee measured 2.04),
% Tu 0.1 % (S8's value, the SU2 tutorial's, not a measured tunnel value). rho 1.22498, |V| 20.4178, mu 1.2506e-04.
SOLVER= INC_RANS
KIND_TURB_MODEL= SA
FREESTREAM_NU_FACTOR= 3.0
KIND_TRANS_MODEL= LM
FREESTREAM_TURBULENCEINTENSITY= 0.001
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
INC_DENSITY_MODEL= CONSTANT
INC_ENERGY_EQUATION= NO
INC_DENSITY_INIT= 1.2249781
INC_VELOCITY_INIT= ( 20.4053837400, 0.7125717020, 0.0 )
INC_NONDIM= INITIAL_VALUES
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= 1.2505692e-04
AOA= 2.0
SIDESLIP_ANGLE= 0.0
REF_ORIGIN_MOMENT_X= 0.25
REF_ORIGIN_MOMENT_Y= 0.0
REF_ORIGIN_MOMENT_Z= 0.0
REF_LENGTH= 1.0
REF_AREA= 0
MARKER_HEATFLUX= ( Airfoil, 0.0 )
MARKER_FAR= ( Farfield )
MARKER_PLOTTING= ( Airfoil )
MARKER_MONITORING= ( Airfoil )
NUM_METHOD_GRAD= GREEN_GAUSS
CONV_NUM_METHOD_FLOW= FDS
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.05
LIMITER_ITER= 500
TIME_DISCRE_FLOW= EULER_IMPLICIT
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= NO
TIME_DISCRE_TURB= EULER_IMPLICIT
CFL_NUMBER= 1.0
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.1, 2.0, 1.0, 50 )
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-4
LINEAR_SOLVER_ITER= 10
ITER= 99999
CONV_FIELD= RMS_PRESSURE
CONV_RESIDUAL_MINVAL= -16
CONV_STARTITER= 25
MESH_FILENAME= ../ogrid_e387.su2
MESH_FORMAT= SU2
OUTPUT_FILES= ( RESTART, SURFACE_CSV, SURFACE_TECPLOT_ASCII )
VOLUME_OUTPUT= ( COORDINATES, SOLUTION, PRIMITIVE )
HISTORY_OUTPUT= ( ITER, RMS_RES, AERO_COEFF, CFL_NUMBER, LINSOL )
SCREEN_OUTPUT= ( INNER_ITER, WALL_TIME, RMS_PRESSURE, RMS_NU_TILDE, RMS_INTERMITTENCY, RMS_RE_THETA_T, LIFT, DRAG )
WRT_FORCES_BREAKDOWN= YES
BREAKDOWN_FILENAME= forces_breakdown.dat
CONV_FILENAME= history
RESTART_FILENAME= restart.dat
SOLUTION_FILENAME= restart.dat
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow
OUTPUT_WRT_FREQ= 250
