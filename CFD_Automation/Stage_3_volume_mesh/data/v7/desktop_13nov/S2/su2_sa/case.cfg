% AERIS Stage 3: SU2 SA (fully turbulent), the ADflow case
% Mesh: whatif_light_VC_e32d995a_re3e5 (1475376 hexahedra). Lengths in mean chords; span +y, lift +z (SU2's AoA turns in x-z).
