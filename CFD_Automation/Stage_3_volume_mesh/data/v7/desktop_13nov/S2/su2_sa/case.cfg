AOA= 4.0
SIDESLIP_ANGLE= 0.0
REF_ORIGIN_MOMENT_X= 0.813825699809589
REF_ORIGIN_MOMENT_Y= 0.0
REF_ORIGIN_MOMENT_Z= 0.0
REF_LENGTH= 1.0
REF_AREA= 3.0000022549956
MARKER_HEATFLUX= ( wall, 0.0 )
MARKER_SYM= ( symmetry )
MARKER_FAR= ( farfield )
MARKER_PLOTTING= ( wall )
MARKER_MONITORING= ( wall )
