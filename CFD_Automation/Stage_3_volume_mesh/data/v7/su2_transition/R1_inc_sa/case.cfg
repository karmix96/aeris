% AERIS Stage 3, SU2 study of 12 Nov 2026: R1, SA (fully turbulent) on SU2's incompressible solver.
% From the case file su2_sa.cfg (V7), two changes, taken together as S8's verified incompressible set
% (runs/su2_validation/naca0012_inc_897, TMR NACA 0012: CL +0.86 %, CDv +0.18 %):
%   SOLVER= RANS (Roe)  ->  INC_RANS (FDS, its only scheme): Mach 0.1 is incompressible, and the compressible
%                           path stalled (V7 night: B1, B1b, B1c, B2b at 2.1 to 2.8 orders).
%   SLOPE_LIMITER_FLOW= VENKATAKRISHNAN (0.05)  ->  NONE, as in S8's incompressible cases (no shocks here).
% Freestream: the compressible case's own (M 0.1, 288.15 K, 101325 Pa, Re 3e5 on the mean chord 1):
%   rho 1.2249781, |V| 34.029703 at 4 deg in x-z (span +y, lift +z), mu = rho |V| c / Re.
% Mesh: whatif_today_VVC_e32d995a_re3e5 (1075074 hexahedra). Lengths in mean chords.
SOLVER= INC_RANS
KIND_TURB_MODEL= SA
FREESTREAM_NU_FACTOR= 3.0
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
INC_DENSITY_MODEL= CONSTANT
INC_ENERGY_EQUATION= NO
INC_DENSITY_INIT= 1.2249781
INC_VELOCITY_INIT= ( 33.9468082297, 0.0, 2.3737920752 )
INC_NONDIM= INITIAL_VALUES
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= 1.3895214e-04
AOA= 4.0
SIDESLIP_ANGLE= 0.0
REF_ORIGIN_MOMENT_X= 0.8136376396673509
REF_ORIGIN_MOMENT_Y= 0.0
REF_ORIGIN_MOMENT_Z= 0.0
REF_LENGTH= 1.0
REF_AREA= 3.00000386634194
MARKER_HEATFLUX= ( wall, 0.0 )
MARKER_SYM= ( symmetry )
MARKER_FAR= ( farfield )
MARKER_PLOTTING= ( wall )
MARKER_MONITORING= ( wall )
NUM_METHOD_GRAD= GREEN_GAUSS
CONV_NUM_METHOD_FLOW= FDS
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= NONE
TIME_DISCRE_FLOW= EULER_IMPLICIT
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= NO
TIME_DISCRE_TURB= EULER_IMPLICIT
