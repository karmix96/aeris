LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-4
LINEAR_SOLVER_ITER= 10
% stopping: no time limit and a budget SU2 will not reach; the run is ended by the monitor once the acceptance
% rule holds (6 orders of the pressure residual and settled forces), or by hand on a measured stall
ITER= 99999
CONV_FIELD= RMS_PRESSURE
CONV_RESIDUAL_MINVAL= -16
CONV_STARTITER= 25
MESH_FILENAME= /home/mike_kara/aeris/CFD_Automation/Stage_3_volume_mesh/data/meshes/whatif_today_VVC_e32d995a_re3e5/volume.su2
