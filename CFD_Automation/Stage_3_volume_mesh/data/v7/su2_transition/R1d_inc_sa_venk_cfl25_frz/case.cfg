% AERIS Stage 3, SU2 study of 12 Nov 2026: R1d, a continuation of R1c (SA, incompressible, Venkatakrishnan 0.05, fixed CFL 25)
% with the limiter frozen after 20 iterations. One change from R1c (inc_sa_venk_cfl25_cont.cfg): LIMITER_ITER= 20.
% Why: R1c's pressure residual was held at about -8.35; D1 (the residual of every point) put 90 % of it on 100 points
% at two leading-edge corners: the root, on the symmetry plane, and the planform kink at y = 1.575 (leading-edge sweep
% 25 to 15 deg). Started from R1c's restart at its stop (iteration 596 of R1c, 10:00), copied in as r1c_restart.dat.
% Freestream: the compressible case's own (M 0.1, 288.15 K, 101325 Pa, Re 3e5 on the mean chord 1):
%   rho 1.2249781, |V| 34.029703 at 4 deg in x-z (span +y, lift +z), mu = rho |V| c / Re.
% Mesh: whatif_today_VVC_e32d995a_re3e5 (1075074 hexahedra). Lengths in mean chords.
SOLVER= INC_RANS
KIND_TURB_MODEL= SA
