% AERIS Stage 3, SU2 study of 12 Nov 2026: R1f, SA on the incompressible solver from the freestream, with the recipe
% the R1b-R1e chain measured. Two changes from R1b (inc_sa_venk.cfg), each from a measurement:
%   LIMITER_ITER= 500: the Venkatakrishnan limiter is frozen after the start-up. R1d: freezing it removed the
%     plateau (R1c held at -8.35 by about 100 points at two leading-edge corners, D1).
%   CFL_ADAPT_PARAM max 1e3 -> 50: with 10 linear iterations SU2 cannot hold a CFL above about 50 (R1e: up x2 to
%     100-220, cut by 10, every 4 to 5 iterations); at 25 to 50 the linear solves meet their target.
% The start stays adaptive from CFL 1, as R1b (which survived its start-up) and the case file.
% Freestream: the compressible case's own (M 0.1, 288.15 K, 101325 Pa, Re 3e5 on the mean chord 1):
%   rho 1.2249781, |V| 34.029703 at 4 deg in x-z (span +y, lift +z), mu = rho |V| c / Re.
% Mesh: whatif_today_VVC_e32d995a_re3e5 (1075074 hexahedra). Lengths in mean chords.
SOLVER= INC_RANS
KIND_TURB_MODEL= SA
FREESTREAM_NU_FACTOR= 3.0
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
INC_DENSITY_MODEL= CONSTANT
INC_ENERGY_EQUATION= NO
INC_DENSITY_INIT= 1.2249781
INC_VELOCITY_INIT= ( 33.9468082297, 0.0, 2.3737920752 )
INC_NONDIM= INITIAL_VALUES
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= 1.3895214e-04
AOA= 4.0
SIDESLIP_ANGLE= 0.0
REF_ORIGIN_MOMENT_X= 0.8136376396673509
REF_ORIGIN_MOMENT_Y= 0.0
REF_ORIGIN_MOMENT_Z= 0.0
REF_LENGTH= 1.0
REF_AREA= 3.00000386634194
MARKER_HEATFLUX= ( wall, 0.0 )
MARKER_SYM= ( symmetry )
MARKER_FAR= ( farfield )
MARKER_PLOTTING= ( wall )
MARKER_MONITORING= ( wall )
NUM_METHOD_GRAD= GREEN_GAUSS
CONV_NUM_METHOD_FLOW= FDS
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.05
LIMITER_ITER= 500
TIME_DISCRE_FLOW= EULER_IMPLICIT
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= NO
TIME_DISCRE_TURB= EULER_IMPLICIT
CFL_NUMBER= 1.0
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.1, 2.0, 1.0, 50 )
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-4
LINEAR_SOLVER_ITER= 10
% stopping: no time limit and a budget SU2 will not reach; the run is ended by the monitor once the acceptance
% rule holds (6 orders of the pressure residual and settled forces), or by hand on a measured stall
ITER= 99999
CONV_FIELD= RMS_PRESSURE
CONV_RESIDUAL_MINVAL= -16
CONV_STARTITER= 25
MESH_FILENAME= /home/mike_kara/aeris/CFD_Automation/Stage_3_volume_mesh/data/meshes/whatif_today_VVC_e32d995a_re3e5/volume.su2
MESH_FORMAT= SU2
OUTPUT_FILES= ( RESTART, SURFACE_CSV, SURFACE_TECPLOT_ASCII )
VOLUME_OUTPUT= ( COORDINATES, SOLUTION, PRIMITIVE )
HISTORY_OUTPUT= ( ITER, RMS_RES, AERO_COEFF, CFL_NUMBER, LINSOL )
SCREEN_OUTPUT= ( INNER_ITER, WALL_TIME, RMS_PRESSURE, RMS_NU_TILDE, LIFT, DRAG )
WRT_FORCES_BREAKDOWN= YES
BREAKDOWN_FILENAME= forces_breakdown.dat
CONV_FILENAME= history
RESTART_FILENAME= restart.dat
SOLUTION_FILENAME= restart.dat
VOLUME_FILENAME= flow
