# ------------------------------------------------------------------------------------------
# HCDI UAS database v13 (Mike's dashboard, 29 Oct 2026): fixed-wing Class I-II aircraft with a span.
# 794 entries; 76 fixed-wing Class I-II; 18 give a span; NONE gives a wing area, so these rows
# only test the span range. The database has no source per row, and some values look like
# defaults (cruise 35 m/s + endurance 6 h + range 100 km on 28 rows; cruise above top speed on 8).
# So only span, class, MTOW and payload are taken. family_src D = the database's layout field.
# check: a correction or doubt about the database row (our knowledge; verify before use).
hcdi_db:
  - {model: Interceptor-mr, class: I, family: tailless, family_src: D, span: 0.9, mtow: null, payload: 1.0, role: Interceptor, use: span}
  - {model: Zala Z-16, class: I, family: tailless, family_src: D, span: 2.815, mtow: 10.5, payload: 1.8, role: ISTAR, use: span,
     check: "manufacturer field reads Nanjing Qinheng Microelectronics (WCH); ZALA Aero is the maker"}
