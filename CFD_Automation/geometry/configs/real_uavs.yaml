# ------------------------------------------------------------------------------------------
# HCDI UAS database v13 (Mike's dashboard, 29 Oct 2026): fixed-wing Class I-II aircraft with a span.
# 794 entries; 76 fixed-wing Class I-II; 18 give a span; NONE gives a wing area, so these rows
# only test the span range. The database has no source per row, and some values look like
# defaults (cruise 35 m/s + endurance 6 h + range 100 km on 28 rows; cruise above top speed on 8).
# So only span, class, MTOW and payload are taken. family_src D = the database's layout field.
# check: a correction or doubt about the database row (our knowledge; verify before use).
hcdi_db:
  - {model: Interceptor-mr, class: I, family: tailless, family_src: D, span: 0.9, mtow: null, payload: 1.0, role: Interceptor, use: span}
  - {model: Zala Z-16, class: I, family: tailless, family_src: D, span: 2.815, mtow: 10.5, payload: 1.8, role: ISTAR, use: span,
     check: "manufacturer field reads Nanjing Qinheng Microelectronics (WCH); ZALA Aero is the maker"}
  - {model: Supercam S350, class: I, family: tailless, family_src: D, span: 3.2, mtow: 15.5, payload: 2.5, role: ISTAR, use: span}
  - {model: SKAT-350M, class: I, family: tailless, family_src: D, span: 3.2, mtow: 15.0, payload: 2.5, role: ISTAR, use: span}
  - {model: Gerbera, class: I, family: tailless, family_src: D, span: 3.5, mtow: 18.0, payload: 4.6, role: Loitering Munition, use: span}
  - {model: Shahed 197, class: I, family: tailless, family_src: D, span: 7.0, mtow: null, payload: null, role: null, use: span,
     check: "7 m span listed as Class I (Small) with no MTOW: class doubtful"}
  - {model: Albatroz, class: II, family: tailless, family_src: D, span: 7.0, mtow: null, payload: 30.0, role: null, use: span}
  - {model: Shahed 191 (Saegheh), class: II, family: tailless, family_src: D, span: 7.31, mtow: null, payload: 50.0, role: null, use: span}
  - {model: CPJ 100-LE, class: I, family: tailless, family_src: D, span: 3.05, mtow: null, payload: 4.54, role: One-Way Attack, use: none,
     check: "top speed 380 km/h (106 m/s) is above Mach 0.3, outside phase 1"}
