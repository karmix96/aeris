  - {model: Orlan-10, class: I, family: tailed, family_src: D, span: 3.05, mtow: 18.0, payload: 5.5, role: ISR, use: span,
     check: "database says Class II, but MTOW 18 kg is Class I"}
  - {model: Orlan-30, class: I, family: tailed, family_src: D, span: 3.05, mtow: 30.0, payload: 12.0, role: ISTAR, use: span}
  - {model: Granat-4, class: I, family: tailed, family_src: D, span: 3.35, mtow: 30.0, payload: 20.0, role: ISTAR, use: span}
  - {model: Merlin-VR, class: I, family: tailed, family_src: D, span: 4.9, mtow: 20.0, payload: 7.0, role: ISTAR, use: span}
  - {model: Corsair, class: II, family: tailed, family_src: K, span: 6.5, mtow: null, payload: 40.0, role: null, use: span}
  - {model: Vestel Karayel, class: II, family: tailed, family_src: K, span: 8.0, mtow: null, payload: 50.0, role: null, use: span}
  - {model: Ababil-3, class: II, family: tailed, family_src: K, span: 8.0, mtow: null, payload: 40.0, role: null, use: span}
  - {model: Hamaseh, class: II, family: tailed, family_src: K, span: 9.0, mtow: null, payload: 50.0, role: null, use: span}
  - {model: Mohajer-6, class: II, family: tailed, family_src: K, span: 10.0, mtow: null, payload: 150.0, role: null, use: span,
     check: "payload 150 kg; class to verify against MTOW"}
