# Real Class I and II fixed-wing UAVs: the evidence behind the size ranges in wing.yaml.
#
# Rule: a number is here only if a source states it. Empty (null) = not found.
# Units: m, m2, kg, m/s. Conversions: 1 kt = 0.5144 m/s, 1 ft = 0.3048 m, 1 ft2 = 0.0929 m2.
# family: tailless (flying wing / BWB, our 'bwb' type) or tailed (wing + tail, our
#   'conventional' and 'tapered' types). family_src: S = a source says so; K = known from
#   photos, not stated in a text source.
# use: ranges = has a wing area, so a mean chord; span = span only; none = shown, not used (why in note).
# Compiled 29 Oct 2026. Re-check a row before quoting it in the paper.

air:   # Stage 0 values (ISA, Sutherland): rho/mu in s/m2
  sea_level: 68500
  1524_m: 60600
  3048_m: 53500

