  - {types: [bwb], var: sweep1_deg, value: 33.0, src: "AUTh RX-3 (c/4)", tag: checked}
  - {types: [bwb], var: sweep1_deg, range: [40.0, 60.0], src: "BlendedNet (Group 3)", tag: agent}
  - {types: [bwb], var: washout_deg, value: 3.0, src: "Suewatanakul 2022", tag: checked}
