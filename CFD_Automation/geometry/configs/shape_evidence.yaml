# Published shape values of real or designed UAV wings: the dots in the design-space figures.
#
# One row = one value (or a range) of one quantity for one wing type, with its source and tag.
#   types:  which generator types it informs (bwb, conventional, tapered, flying_wing)
#   var:    an input name from wing.yaml, or a derived quantity:
#           taper (tip / root chord), washout_deg (root twist - tip twist, + = tip nose down),
#           span_m, mean_chord_m
#   value:  one number;  range: [lo, hi] (a design-space or family range)
#   tag:    checked (read by us) | agent (read by the research agent only) | second_hand (quoted by another page)
#   note:   c/4 = quarter-chord sweep (the generator uses leading-edge sweep, a few degrees more)
# Size values of whole aircraft (span, mean chord, AR) come from configs/real_uavs.yaml, not from here.
# Compiled 30 Oct 2026. Bases: geometry/decisions/shape_ranges.md.

points:
  # --- BWB ------------------------------------------------------------------------------------------
  - {types: [bwb], var: root_chord_m, value: 1.80, src: "Wang & Zhou 2022", tag: checked}
  - {types: [bwb], var: aspect_ratio, value: 8.0, src: "AUTh RX-3 (Antoniou 2025)", tag: checked}
  - {types: [bwb], var: c2_ratio, value: 0.61, src: "Wang & Zhou 2022", tag: checked}
  - {types: [bwb], var: c2_ratio, value: 0.667, src: "Hainline & Agarwal 2017", tag: checked}
  - {types: [bwb], var: c2_ratio, range: [0.55, 0.85], src: "BlendedNet (Group 3)", tag: agent}
  - {types: [bwb], var: c3_ratio, value: 0.39, src: "Wang & Zhou 2022", tag: checked}
  - {types: [bwb], var: c3_ratio, value: 0.42, src: "Hainline & Agarwal 2017", tag: checked}
  - {types: [bwb], var: c3_ratio, range: [0.18, 0.28], src: "BlendedNet (Group 3)", tag: agent}
  - {types: [bwb], var: c4_ratio, value: 0.14, src: "Wang & Zhou 2022", tag: checked}
  - {types: [bwb], var: c4_ratio, value: 0.13, src: "Hainline & Agarwal 2017", tag: checked}
  - {types: [bwb], var: c4_ratio, range: [0.06, 0.09], src: "BlendedNet (Group 3)", tag: agent}
  - {types: [bwb], var: b3_ratio, value: 0.50, src: "Wang & Zhou 2022", tag: checked}
  - {types: [bwb], var: split_ratio, value: 0.48, src: "Wang & Zhou 2022", tag: checked}
  - {types: [bwb], var: sweep1_deg, value: 15.0, src: "Lehmkuehler 2012", tag: checked}
