  - {types: [conventional, tapered], var: washout_deg, value: 3.0, src: "Raymer (good stall)", tag: second_hand}
  - {types: [conventional, tapered], var: dihedral_p1_deg, range: [0.0, 5.0], src: "Raymer: about 0 to 5", tag: checked}
  # --- design-space bounds of another automated wing study (full-space anchors) ------------------------
  - {types: [bwb, conventional, tapered, flying_wing], var: dihedral_p1_deg, range: [-10.0, 10.0], src: "Pliakos 2025 bounds", tag: checked, bound: true}
  - {types: [bwb, conventional, tapered, flying_wing], var: sweep1_deg, range: [0.0, 60.0], src: "Pliakos 2025 bounds (c/4)", tag: checked, bound: true}
