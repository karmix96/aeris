# CFD_Automation — the one wing config (Stage 1).
#
# Stations b0 (root), b1, b2, b3 (tip); three straight panels between them.
# Panel spans: outer = b3_ratio * S; the rest (1 - b3_ratio) * S is split into
# inner = split_ratio * rest and middle = the remainder.
# Sweep: leading edge, signed, positive = aft. Twist: positive = nose up, at each station.
# Dihedral: one per straight panel (p1 inner, p2 middle, p3 outer), positive = tip up.
# Every variable varies unless listed under `pinned` or computed by a law.
#
# What is sampled and what is derived (per type, from the laws below):
#   size:   root_chord_m and aspect_ratio are sampled; the semi-span follows:
#           S = aspect_ratio * root_chord * K / 2,  K = mean chord / root chord
#             = sum over panels of (panel span fraction) * (chord ratio in + chord ratio out) / 2
#   chords  stations:     c2, c3, c4 = chord / root chord (BWB)
#           per_panel:    c2 = c(b1)/c(b0), c3 = c(b2)/c(b1), c4 = c(b3)/c(b2), each <= 1 (cranked)
#           linear_taper: c4 = tip / root; c2, c3 follow (straight edges) (tapered, flying wing)
#   sweeps  panels: one per panel.   one: sweep2 = sweep3 = sweep1 (straight leading edge)
# Sizes come from real Class I-II UAVs (configs/real_uavs.yaml, scripts/real_uav_check.py);
# shapes are AERIS values or our choice (no source yet).

wing_type: mixed                      # bwb | conventional | tapered | flying_wing | mixed
shares: {bwb: 0.25, conventional: 0.25, tapered: 0.25, flying_wing: 0.25}   # used only when wing_type = mixed
wing_class: I                         # I | II  (sets the trailing-edge floor)

trailing_edge:
  floor_m: {I: 0.0005, II: 0.0010}    # minimum thickness, by class
  chord_fraction: 0.002               # 0.2 % of local chord
  open_from_xc: 0.90                  # linear ramp over the last 10 % of chord (pyGeo bluntTaperRange 0.1)

types:
  bwb:                                # blended wing body: big root chord, strong taper, cranked
    chord_law: stations
    sweep_law: panels
    span_mode: aspect_ratio
    airfoils: [mh91, mh91, e374, nlf1015]   # b0, b1, b2, b3
    pinned: {}
    ranges:
      root_chord_m:    [0.40, 0.80]   # real tailless wings: configs/real_uavs.yaml
      aspect_ratio:    [3.0, 9.0]     # real tailless wings: 2.9-8.6
      c2_ratio:        [0.55, 0.80]
      c3_ratio:        [0.30, 0.55]
      c4_ratio:        [0.08, 0.20]
      b3_ratio:        [0.40, 0.55]
      split_ratio:     [0.40, 0.60]
      sweep1_deg:      [20.0, 40.0]
      sweep2_deg:      [15.0, 35.0]
      sweep3_deg:      [5.0, 25.0]
      twist0_deg:      [-1.0, 1.0]
      twist1_deg:      [-3.0, 0.0]
      twist2_deg:      [-5.0, -1.0]
      twist3_deg:      [-8.0, -2.0]
      dihedral_p1_deg: [0.0, 3.0]
      dihedral_p2_deg: [0.0, 5.0]
      dihedral_p3_deg: [0.0, 8.0]

  conventional:                       # cranked wing with a tail: chord and sweep may change at b1 and b2
    chord_law: per_panel              # each panel's own taper, so no chord grows outboard
    sweep_law: panels
    span_mode: aspect_ratio
    airfoils: [naca4415, naca4415, naca4412, naca4412]
    pinned: {}
    ranges:
      root_chord_m:    [0.13, 0.75]   # real wings with a tail: configs/real_uavs.yaml
      aspect_ratio:    [4.5, 16.5]    # real wings with a tail: 4.9-16.0 (16.5 at 630 kg)
      c2_ratio:        [0.80, 1.00]   # c(b1) / c(b0)
      c3_ratio:        [0.70, 1.00]   # c(b2) / c(b1)
      c4_ratio:        [0.50, 1.00]   # c(b3) / c(b2); overall taper 0.28-1
      b3_ratio:        [0.20, 0.50]
      split_ratio:     [0.30, 0.70]
      sweep1_deg:      [-10.0, 20.0]
      sweep2_deg:      [-10.0, 20.0]
      sweep3_deg:      [-10.0, 20.0]
      twist0_deg:      [0.0, 3.0]
      twist1_deg:      [-1.0, 2.0]
      twist2_deg:      [-2.0, 1.0]
      twist3_deg:      [-4.0, 0.0]
      dihedral_p1_deg: [-3.0, 6.0]
      dihedral_p2_deg: [-3.0, 6.0]
      dihedral_p3_deg: [-3.0, 6.0]

  tapered:                            # wing with a tail and straight edges root to tip (rectangular when c4 = 1)
    chord_law: linear_taper
    sweep_law: one
    span_mode: aspect_ratio
    airfoils: [naca4415, naca4415, naca4412, naca4412]
    pinned: {}
    ranges:                           # c2, c3, sweep2, sweep3 and the semi-span follow from the laws
      root_chord_m:    [0.13, 0.75]
      aspect_ratio:    [4.5, 16.5]
      c4_ratio:        [0.40, 1.00]   # taper ratio tip / root
      b3_ratio:        [0.20, 0.50]   # stations still set where twist and dihedral may change
      split_ratio:     [0.30, 0.70]
      sweep1_deg:      [-10.0, 20.0]  # the one leading-edge sweep
      twist0_deg:      [0.0, 3.0]
      twist1_deg:      [-1.0, 2.0]
      twist2_deg:      [-2.0, 1.0]
      twist3_deg:      [-4.0, 0.0]
      dihedral_p1_deg: [-3.0, 6.0]
      dihedral_p2_deg: [-3.0, 6.0]
      dihedral_p3_deg: [-3.0, 6.0]

  flying_wing:                        # tailless, straight edges, moderate taper, swept (Aquila, X8 style)
    chord_law: linear_taper
    sweep_law: one
    span_mode: aspect_ratio
    airfoils: [mh45, mh45, mh60, mh60]   # reflexed flying-wing sections (our choice)
    pinned: {}
    ranges:
      root_chord_m:    [0.25, 1.05]   # real tailless wings: mean chord 0.23-0.78 m (Aquila root 1.02 m)
      aspect_ratio:    [3.0, 9.0]     # real tailless wings: 2.9-8.6 (Aquila 4.9)
      c4_ratio:        [0.30, 0.80]   # taper (Aquila 0.58); our choice
      b3_ratio:        [0.20, 0.50]
      split_ratio:     [0.30, 0.70]
      sweep1_deg:      [10.0, 35.0]   # leading edge (Aquila 28 deg); our choice
      twist0_deg:      [-1.0, 2.0]    # washout toward the tip
      twist1_deg:      [-2.0, 1.0]
      twist2_deg:      [-4.0, 0.0]
      twist3_deg:      [-6.0, -1.0]
      dihedral_p1_deg: [0.0, 5.0]     # Aquila 4 deg
      dihedral_p2_deg: [0.0, 5.0]
      dihedral_p3_deg: [0.0, 5.0]

sets:
  seeds:
    bwb:          {training: 1001, holdout: 2001}
    conventional: {training: 1002, holdout: 2002}
    tapered:      {training: 1003, holdout: 2003}
    flying_wing:  {training: 1004, holdout: 2004}
  training_size: 100
  holdout_size: 10
  coverage_random_sets: 1000
  coverage_seed: 3001
