# CFD_Automation — the one wing config (Stage 1).
#
# Stations b0 (root), b1, b2, b3 (tip); three straight panels between them.
# Panel spans: outer = b3_ratio * S; the rest (1 - b3_ratio) * S is split into
# inner = split_ratio * rest and middle = the remainder.
# Sweep: leading edge, signed, positive = aft. Twist: positive = nose up.
# Dihedral: positive = tip up. Every variable varies unless listed under `pinned`.
#
# chord_law  stations:     c2, c3, c4 = chord / root chord
#            per_panel:    c2 = c(b1)/c(b0), c3 = c(b2)/c(b1), c4 = c(b3)/c(b2)  (each <= 1: never wider outboard)
#            linear_taper: c4 = tip / root; c2, c3 follow (straight trailing edge)
# sweep_law  panels: one sweep per panel.   one: sweep2 = sweep3 = sweep1 (straight leading edge)
# Variables a law computes (c2, c3 under linear_taper; sweep2, sweep3 under one) need no range.

wing_type: mixed                      # bwb | conventional | tapered | mixed
shares: {bwb: 0.5, conventional: 0.25, tapered: 0.25}   # used only when wing_type = mixed
wing_class: I                         # I | II  (sets the trailing-edge floor)

trailing_edge:
  floor_m: {I: 0.0005, II: 0.0010}    # minimum thickness, by class
  chord_fraction: 0.002               # 0.2 % of local chord
  open_from_xc: 0.90                  # linear ramp over the last 10 % of chord (pyGeo bluntTaperRange 0.1)

types:
  bwb:
    chord_law: stations               # stations | linear_taper
    span_mode: root_chord_fractions   # semi_span_m is read in root chords (keeps the aspect ratio real)
    airfoils: [mh91, mh91, e374, nlf1015]   # b0, b1, b2, b3
    pinned: {}
    ranges:
      root_chord_m:  [0.40, 0.80]     # sizes from real tailless wings: configs/real_uavs.yaml
      c2_ratio:      [0.55, 0.80]
      c3_ratio:      [0.30, 0.55]
      c4_ratio:      [0.08, 0.20]
      semi_span_m:   [0.75, 2.2]      # semi-span / root chord: span 0.6-3.5 m, AR about 3-10
      b3_ratio:      [0.40, 0.55]
      split_ratio:   [0.40, 0.60]
      sweep1_deg:    [20.0, 40.0]
      sweep2_deg:    [15.0, 35.0]
      sweep3_deg:    [5.0, 25.0]
      twist0_deg:    [-1.0, 1.0]
      twist1_deg:    [-3.0, 0.0]
      twist2_deg:    [-5.0, -1.0]
      twist3_deg:    [-8.0, -2.0]
      dihedral0_deg: [0.0, 3.0]
      dihedral1_deg: [0.0, 3.0]
      dihedral2_deg: [0.0, 6.0]
      dihedral3_deg: [0.0, 10.0]

  conventional:                       # conventional wing with breaks: chord and sweep may change at b1 and b2
    chord_law: per_panel              # each panel's own taper, so no chord grows outboard
    sweep_law: panels
    span_mode: root_chord_fractions   # semi_span_m is read in root chords here
    airfoils: [naca4415, naca4415, naca4412, naca4412]
    pinned: {}
    ranges:
      root_chord_m:  [0.13, 0.75]     # sizes from real wings with a tail: configs/real_uavs.yaml
      c2_ratio:      [0.80, 1.00]     # c(b1) / c(b0)
      c3_ratio:      [0.70, 1.00]     # c(b2) / c(b1)
      c4_ratio:      [0.50, 1.00]     # c(b3) / c(b2); overall taper 0.28-1
      semi_span_m:   [2.0, 7.5]       # semi-span / root chord
      b3_ratio:      [0.20, 0.50]
      split_ratio:   [0.30, 0.70]
      sweep1_deg:    [-10.0, 20.0]
      sweep2_deg:    [-10.0, 20.0]
      sweep3_deg:    [-10.0, 20.0]
      twist0_deg:    [0.0, 3.0]
      twist1_deg:    [-1.0, 2.0]
      twist2_deg:    [-2.0, 1.0]
      twist3_deg:    [-4.0, 0.0]
      dihedral0_deg: [-3.0, 6.0]
      dihedral1_deg: [-3.0, 6.0]
      dihedral2_deg: [-3.0, 6.0]
      dihedral3_deg: [-3.0, 6.0]

  tapered:                            # conventional wing with straight edges root to tip (rectangular when c4 = 1)
    chord_law: linear_taper           # one taper ratio
    sweep_law: one                    # one leading-edge sweep
    span_mode: root_chord_fractions
    airfoils: [naca4415, naca4415, naca4412, naca4412]
    pinned: {}
    ranges:                           # c2, c3, sweep2, sweep3 follow from the laws
      root_chord_m:  [0.13, 0.75]
      c4_ratio:      [0.40, 1.00]     # taper ratio tip / root
      semi_span_m:   [2.0, 7.5]       # semi-span / root chord
      b3_ratio:      [0.20, 0.50]     # stations still set where twist and dihedral may change
      split_ratio:   [0.30, 0.70]
      sweep1_deg:    [-10.0, 20.0]    # the one leading-edge sweep
      twist0_deg:    [0.0, 3.0]
      twist1_deg:    [-1.0, 2.0]
      twist2_deg:    [-2.0, 1.0]
      twist3_deg:    [-4.0, 0.0]
      dihedral0_deg: [-3.0, 6.0]
      dihedral1_deg: [-3.0, 6.0]
      dihedral2_deg: [-3.0, 6.0]
      dihedral3_deg: [-3.0, 6.0]

sets:
  seeds:
    bwb:          {training: 1001, holdout: 2001}
    conventional: {training: 1002, holdout: 2002}
    tapered:      {training: 1003, holdout: 2003}
  training_size: 100
  holdout_size: 10
  coverage_random_sets: 1000
  coverage_seed: 3001
