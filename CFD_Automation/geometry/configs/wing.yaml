# CFD_Automation — the one wing config (Stage 1).
#
# Stations b0 (root), b1, b2, b3 (tip); three straight panels between them.
# Panel spans: outer = b3_ratio * S; the rest (1 - b3_ratio) * S is split into
# inner = split_ratio * rest and middle = the remainder.
# Sweep: leading edge, signed, positive = aft. Twist: positive = nose up, at each station.
# Dihedral: one per straight panel (p1 inner, p2 middle, p3 outer), positive = tip up.
# Every variable varies unless listed under `pinned` or computed by a law.
#
# What is sampled and what is derived (per type, from the laws below):
#   size:   root_chord_m and aspect_ratio are sampled; the semi-span follows:
#           S = aspect_ratio * root_chord * K / 2,  K = mean chord / root chord
#             = sum over panels of (panel span fraction) * (chord ratio in + chord ratio out) / 2
#   chords  stations:     c2, c3, c4 = chord / root chord (BWB)
#           per_panel:    c2 = c(b1)/c(b0), c3 = c(b2)/c(b1), c4 = c(b3)/c(b2), each <= 1 (cranked)
#           linear_taper: c4 = tip / root; c2, c3 follow (straight edges) (tapered, flying wing)
#   sweeps  panels: one per panel.   one: sweep2 = sweep3 = sweep1 (straight leading edge)
# Sizes come from real Class I-II UAVs (configs/real_uavs.yaml, scripts/real_uav_check.py);
# shapes from design guidance and published UAV geometry (geometry/decisions/shape_ranges.md).

wing_type: mixed                      # bwb | conventional | tapered | flying_wing | mixed
shares: {bwb: 0.25, conventional: 0.25, tapered: 0.25, flying_wing: 0.25}   # used only when wing_type = mixed
wing_class: I                         # I | II  (sets the trailing-edge floor)

trailing_edge:
  floor_m: {I: 0.0005, II: 0.0010}    # minimum thickness, by class
  chord_fraction: 0.002               # 0.2 % of local chord
  open_from_xc: 0.90                  # linear ramp over the last 10 % of chord (pyGeo bluntTaperRange 0.1)

types:
  # Two spaces per type (decided 30 Oct 2026):
  #   ranges + airfoils:            the FOCUS space: realistic Class I-II wings, sampled densely
  #   full_ranges + full_airfoils:  the FULL space: everything the generator supports, sampled sparsely;
  #                                 a variable not in full_ranges keeps its focus range
  # The focus box lies inside the full box. Bases: geometry/decisions/shape_ranges.md.
  bwb:                                # blended wing body: big root chord, strong taper, cranked
    chord_law: stations
    sweep_law: panels
    span_mode: aspect_ratio
    airfoils: [mh104, mh104, mh61, mh61]   # body MH 104 (15 %), wing MH 61 (10 %), reflexed: Suewatanakul et al. 2022
    pinned: {}
    ranges:
      root_chord_m:    [0.40, 1.80]   # real tailless wings; Wang & Zhou 2022 root 1.80 m; AUTh RX-3 (S 4.9 m2, AR 8)
      aspect_ratio:    [3.0, 9.0]     # real tailless wings 2.9-8.6
      c2_ratio:        [0.55, 0.80]   # BlendedNet 0.55-0.85; Wang & Zhou 2022 0.61
      c3_ratio:        [0.30, 0.55]   # Wang & Zhou 2022 0.39 (BlendedNet, a Group 3 vehicle: 0.18-0.28)
      c4_ratio:        [0.06, 0.20]   # Wang & Zhou 2022 0.14; BlendedNet 0.06-0.09
      b3_ratio:        [0.40, 0.55]   # Wang & Zhou 2022: outer panel 0.50 of the semi-span
      split_ratio:     [0.40, 0.60]   # Wang & Zhou 2022: 0.48
      sweep1_deg:      [15.0, 40.0]   # Lehmkuehler et al. 2012: 15; Suewatanakul et al. 2022: 30 (c/4)
      sweep2_deg:      [15.0, 35.0]
      sweep3_deg:      [5.0, 25.0]
      twist0_deg:      [-1.0, 1.0]    # washout 1-9 deg; Suewatanakul 2022 about 3, Hainline & Agarwal 2017 about 7
      twist1_deg:      [-3.0, 0.0]
      twist2_deg:      [-5.0, -1.0]
      twist3_deg:      [-8.0, -2.0]
      dihedral_p1_deg: [0.0, 3.0]     # Raymer: "normally about 0 to 5 degrees"; Suewatanakul 2022: 5
      dihedral_p2_deg: [0.0, 5.0]
      dihedral_p3_deg: [0.0, 5.0]
    full_airfoils:                    # full space: every sourced section is a candidate (first = suggested)
      - [mh104, s5010, mh60, naca4415]
      - [mh104, s5010, mh60, naca4415]
      - [mh61, s5010, mh45, naca4412]
      - [mh61, s5010, mh45, naca4412]
    full_ranges:                      # full space: what the generator supports (sampled sparsely, corners here)
      root_chord_m:    [0.30, 2.50]
      aspect_ratio:    [2.5, 10.0]
      c2_ratio:        [0.45, 0.90]   # BlendedNet 0.55-0.85
      c3_ratio:        [0.15, 0.60]   # BlendedNet 0.18-0.28
      c4_ratio:        [0.04, 0.25]   # BlendedNet 0.06-0.09
      b3_ratio:        [0.30, 0.65]
      split_ratio:     [0.25, 0.75]
      sweep1_deg:      [10.0, 60.0]   # BlendedNet 40-60
      sweep2_deg:      [10.0, 60.0]
      sweep3_deg:      [0.0, 60.0]    # BlendedNet 24-40; Pliakos 0-60
      twist0_deg:      [-2.0, 6.0]    # Hainline & Agarwal 2017: root 6
      twist1_deg:      [-5.0, 5.0]   # Pliakos et al. 2025 design-space bound
      twist2_deg:      [-5.0, 5.0]
      twist3_deg:      [-10.0, 7.0]    # Pliakos +-7; Hainline washout 7
      dihedral_p1_deg: [-10.0, 10.0]   # Pliakos et al. 2025 design-space bound
      dihedral_p2_deg: [-10.0, 10.0]
      dihedral_p3_deg: [-10.0, 10.0]

  conventional:                       # cranked wing with a tail: chord and sweep may change at b1 and b2
    chord_law: per_panel              # each panel's own taper, so no chord grows outboard
    sweep_law: panels
    span_mode: aspect_ratio
    airfoils: [naca4415, naca4415, naca4412, naca4412]   # NACA 4415 on Pioneer and Shadow 200 (Lednicer)
    pinned: {}
    ranges:
      root_chord_m:    [0.13, 0.75]   # real wings with a tail (configs/real_uavs.yaml)
      aspect_ratio:    [4.5, 16.5]    # real wings with a tail 4.9-16.0
      c2_ratio:        [0.85, 1.00]   # per panel; overall taper >= 0.41 (Raymer: about 0.4 for unswept wings)
      c3_ratio:        [0.75, 1.00]
      c4_ratio:        [0.65, 1.00]
      b3_ratio:        [0.20, 0.50]   # our choice: break anywhere from 25 % to 80 % of the span
      split_ratio:     [0.30, 0.70]
      sweep1_deg:      [-5.0, 15.0]   # low-speed wings near 0 deg c/4 (Raymer); small forward sweep as an edge case
      sweep2_deg:      [-5.0, 15.0]
      sweep3_deg:      [-5.0, 15.0]
      twist0_deg:      [0.0, 2.0]     # washout 0-5 deg: Raymer about 3 deg for good stall behaviour
      twist1_deg:      [-1.0, 2.0]
      twist2_deg:      [-2.0, 1.0]
      twist3_deg:      [-3.0, 0.0]
      dihedral_p1_deg: [0.0, 5.0]     # Raymer: "normally about 0 to 5 degrees"
      dihedral_p2_deg: [0.0, 5.0]
      dihedral_p3_deg: [0.0, 5.0]
    full_airfoils:
      - [naca4415, naca4412, mh104, mh60, s5010]
      - [naca4415, naca4412, mh104, mh60, s5010]
      - [naca4412, naca4415, mh61, mh45, s5010]
      - [naca4412, naca4415, mh61, mh45, s5010]
    full_ranges:
      root_chord_m:    [0.08, 1.00]
      aspect_ratio:    [3.0, 20.0]
      c2_ratio:        [0.70, 1.00]
      c3_ratio:        [0.60, 1.00]
      c4_ratio:        [0.40, 1.00]
      b3_ratio:        [0.15, 0.60]
      split_ratio:     [0.20, 0.80]
      sweep1_deg:      [-15.0, 35.0]
      sweep2_deg:      [-15.0, 35.0]
      sweep3_deg:      [-15.0, 35.0]
      twist0_deg:      [-2.0, 4.0]
      twist1_deg:      [-5.0, 5.0]   # Pliakos et al. 2025 design-space bound
      twist2_deg:      [-5.0, 5.0]
      twist3_deg:      [-7.0, 7.0]    # Pliakos et al. 2025
      dihedral_p1_deg: [-10.0, 10.0]   # Pliakos et al. 2025 design-space bound
      dihedral_p2_deg: [-10.0, 10.0]
      dihedral_p3_deg: [-10.0, 10.0]

  tapered:                            # wing with a tail and straight edges root to tip (rectangular when c4 = 1)
    chord_law: linear_taper
    sweep_law: one
    span_mode: aspect_ratio
    airfoils: [naca4415, naca4415, naca4412, naca4412]
    pinned: {}
    ranges:                           # c2, c3, sweep2, sweep3 and the semi-span follow from the laws
      root_chord_m:    [0.13, 0.75]
      aspect_ratio:    [4.5, 16.5]
      c4_ratio:        [0.40, 1.00]   # Raymer: about 0.4 for unswept wings; rectangular on Pioneer and Shadow
      b3_ratio:        [0.20, 0.50]   # stations still set where twist and dihedral may change (our choice)
      split_ratio:     [0.30, 0.70]
      sweep1_deg:      [-5.0, 15.0]   # the one leading-edge sweep
      twist0_deg:      [0.0, 2.0]
      twist1_deg:      [-1.0, 2.0]
      twist2_deg:      [-2.0, 1.0]
      twist3_deg:      [-3.0, 0.0]
      dihedral_p1_deg: [0.0, 5.0]
      dihedral_p2_deg: [0.0, 5.0]
      dihedral_p3_deg: [0.0, 5.0]
    full_airfoils:
      - [naca4415, naca4412, mh104, mh60, s5010]
      - [naca4415, naca4412, mh104, mh60, s5010]
      - [naca4412, naca4415, mh61, mh45, s5010]
      - [naca4412, naca4415, mh61, mh45, s5010]
    full_ranges:
      root_chord_m:    [0.08, 1.00]
      aspect_ratio:    [3.0, 20.0]
      c4_ratio:        [0.25, 1.00]
      b3_ratio:        [0.15, 0.60]
      split_ratio:     [0.20, 0.80]
      sweep1_deg:      [-15.0, 35.0]
      twist0_deg:      [-2.0, 4.0]
      twist1_deg:      [-5.0, 5.0]   # Pliakos et al. 2025 design-space bound
      twist2_deg:      [-5.0, 5.0]
      twist3_deg:      [-7.0, 7.0]    # Pliakos et al. 2025
      dihedral_p1_deg: [-10.0, 10.0]   # Pliakos et al. 2025 design-space bound
      dihedral_p2_deg: [-10.0, 10.0]
      dihedral_p3_deg: [-10.0, 10.0]

  flying_wing:                        # tailless, straight edges, moderate taper, swept
    chord_law: linear_taper
    sweep_law: one
    span_mode: aspect_ratio
    airfoils: [mh60, mh60, mh45, mh45]   # Hepperle tailless sections: MH 60 for Re >= 1.5e5 (root), MH 45 below (tip)
    pinned: {}
    ranges:
      root_chord_m:    [0.25, 1.05]   # real tailless wings (Aquila root 1.02 m)
      aspect_ratio:    [3.0, 9.0]     # real tailless wings; Milenkovic-Babic et al. 2024: 4.29
      c4_ratio:        [0.30, 0.90]   # Milenkovic-Babic 2024: 0.667; Panknin example 0.85; Aquila 0.58
      b3_ratio:        [0.20, 0.50]   # our choice
      split_ratio:     [0.30, 0.70]
      sweep1_deg:      [10.0, 40.0]   # Milenkovic-Babic 25; Aquila 28; Horten-Panek PUL-10 35; flying-wing MAV 40
      twist0_deg:      [-1.0, 2.0]    # washout 0-8 deg: Panknin example 3.2; Prandtl-D (bell loading) about 10
      twist1_deg:      [-2.0, 1.0]
      twist2_deg:      [-4.0, 0.0]
      twist3_deg:      [-6.0, -1.0]
      dihedral_p1_deg: [0.0, 5.0]     # Horten-Panek PUL-10 4; flying-wing MAV 2
      dihedral_p2_deg: [0.0, 5.0]
      dihedral_p3_deg: [0.0, 5.0]
    full_airfoils:
      - [mh60, mh45, mh104, s5010, naca4415]
      - [mh60, mh45, mh104, s5010, naca4415]
      - [mh45, mh60, mh61, s5010, naca4412]
      - [mh45, mh60, mh61, s5010, naca4412]
    full_ranges:
      root_chord_m:    [0.15, 1.20]
      aspect_ratio:    [2.5, 12.0]    # Panknin example 10
      c4_ratio:        [0.20, 1.00]
      b3_ratio:        [0.15, 0.60]
      split_ratio:     [0.20, 0.80]
      sweep1_deg:      [0.0, 60.0]    # Pliakos et al. 2025: c/4 sweep 0-60
      twist0_deg:      [-2.0, 4.0]
      twist1_deg:      [-5.0, 5.0]   # Pliakos et al. 2025 design-space bound
      twist2_deg:      [-5.0, 5.0]
      twist3_deg:      [-12.0, 7.0]   # Prandtl-D about 10 washout; Pliakos +7
      dihedral_p1_deg: [-10.0, 10.0]   # Pliakos et al. 2025 design-space bound
      dihedral_p2_deg: [-10.0, 10.0]
      dihedral_p3_deg: [-10.0, 10.0]

sets:
  seeds:
    bwb:          {training: 1001, holdout: 2001, training_full: 1101, holdout_full: 2101}
    conventional: {training: 1002, holdout: 2002, training_full: 1102, holdout_full: 2102}
    tapered:      {training: 1003, holdout: 2003, training_full: 1103, holdout_full: 2103}
    flying_wing:  {training: 1004, holdout: 2004, training_full: 1104, holdout_full: 2104}
  training_size: 100                  # focus space (dense)
  holdout_size: 10
  training_full_size: 40              # full space (sparse)
  holdout_full_size: 5
  coverage_random_sets: 1000
  coverage_seed: 3001
