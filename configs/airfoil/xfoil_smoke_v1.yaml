# AERIS 2D — Smoke sweep config
# Airfoil count is selected by CLI/GUI via --n-airfoils, NOT by this file.
# This file only defines alpha/Re/Mach/XFOIL solver settings for a fast
# end-to-end pipeline check.
# Full config: configs/airfoil/xfoil_sweep_v1.yaml

sweep:
  alpha_start: -4.0
  alpha_end:   10.0
  alpha_step:   2.0     # 8 alpha points — fast
  reynolds:
    - 1_000_000         # single Re
  mach:
    - 0.0
  ncrit: 9.0

solver:
  max_iter: 100
  repanel: true

output:
  drop_unconverged: false
  solver_id: xfoil_python
