schema: aeris.pygeo_surface_mesh_study.v1
name: pygeo_bwb_surface_mesh_geometry_laws

geometry:
  definition_config: configs/geometry/pygeo_surface_study_simple.yaml
  airfoil_database: data/airfoil_database
  extraction:
    # Fixed for every case. This avoids the near-duplicate stations present in
    # the production feature-extraction lattice and removes section-count bias.
    source_sections: 14
    chordwise_points: 301
    cst_order: 8
    minimum_spacing_fraction: 0.0001

# Public study values. Aft sweep is positive here and converted to Aeris's
# internal negative-aft convention with sample_scale=-1.
variables:
  c1_m:
    {sample_field: c1_m, units: m, baseline: 1.60, low: 1.20, high: 2.00}
  c2_ratio:
    {sample_field: c2_ratio, units: "1", baseline: 0.75, low: 0.65, high: 0.85}
  c3_ratio:
    {sample_field: c3_ratio, units: "1", baseline: 0.50, low: 0.40, high: 0.60}
  c4_ratio:
    {sample_field: c4_ratio, units: "1", baseline: 0.25, low: 0.15, high: 0.35}
  b_total_m:
    {sample_field: b_total_m, units: m, baseline: 1.60, low: 1.20, high: 2.00}
  b3_ratio:
    {sample_field: b3_ratio, units: "1", baseline: 0.3333333333333333, low: 0.25, high: 0.45}
  split_ratio:
    {sample_field: split_ratio, units: "1", baseline: 0.50, low: 0.35, high: 0.65}

  sw1_deg:
    {sample_field: sw1_deg, units: deg, baseline: 0.0, low: 0.0, high: 55.0, sample_scale: -1.0}
  sw2_deg:
    {sample_field: sw2_deg, units: deg, baseline: 0.0, low: 0.0, high: 35.0, sample_scale: -1.0}
  sw3_deg:
    {sample_field: sw3_deg, units: deg, baseline: 0.0, low: 0.0, high: 25.0, sample_scale: -1.0}

  twist_b0_deg:
    {sample_field: twist_b0_deg, units: deg, baseline: 0.0, low: -6.0, high: 6.0}
  twist_b1_deg:
    {sample_field: twist_b1_deg, units: deg, baseline: 0.0, low: -8.0, high: 6.0}
  twist_b2_deg:
    {sample_field: twist_b2_deg, units: deg, baseline: 0.0, low: -10.0, high: 5.0}
  twist_b3_deg:
    {sample_field: twist_b3_deg, units: deg, baseline: 0.0, low: -12.0, high: 4.0}

  dihedral_b1_deg:
    {sample_field: dihedral_b1_deg, units: deg, baseline: 0.0, low: -8.0, high: 8.0}
  dihedral_b2_deg:
    {sample_field: dihedral_b2_deg, units: deg, baseline: 0.0, low: -10.0, high: 12.0}
  dihedral_b3_deg:
    {sample_field: dihedral_b3_deg, units: deg, baseline: 0.0, low: -12.0, high: 15.0}

ofat:
  # Piecewise normalized about baseline. Zero is a separately stored baseline.
  fractions: [-1.0, -0.5, 0.5, 1.0]

interactions:
  pairwise:
    enabled: true
    # Variables are ranked from their common-L3 OFAT response first.
    top_k: 6
    fractions: [-1.0, 1.0]
    max_cases: 60
  lhs:
    enabled: true
    samples: 64
    seed: 20260724

mesh:
  # Every geometry gets L3 even when a coarser level passes. Geometry laws use
  # only this common reference, preventing adaptive-resolution confounding.
  reference_level: L3

  # Five-level, near-constant r≈sqrt(2) family from MESH_FAMILY_V2.md.
  levels:
    L1:
      order: 1
      points_per_block_side: 25
      spanwise_panels_per_section: 8
      cap_wrap_points: 11
      tip_radial_points: 5
    L2:
      order: 2
      points_per_block_side: 33
      spanwise_panels_per_section: 12
      cap_wrap_points: 15
      tip_radial_points: 7
    L3:
      order: 3
      points_per_block_side: 49
      spanwise_panels_per_section: 16
      cap_wrap_points: 21
      tip_radial_points: 9
    L4:
      order: 4
      points_per_block_side: 65
      spanwise_panels_per_section: 24
      cap_wrap_points: 29
      tip_radial_points: 13
    L5:
      order: 5
      points_per_block_side: 97
      spanwise_panels_per_section: 32
      cap_wrap_points: 43
      tip_radial_points: 17

  common:
    oml_topology: cap4
    tip_topology: cap4
    dense_airfoil_points_per_surface: 301
    split_x_fore: 0.20
    minimum_te_thickness: 0.002
    te_thickness: 0.005
    te_thickness_abs_floor: 0.0
    te_base_points: 0

    # Construction floors catch collapse/folding only. The editable scientific
    # limits below decide whether an otherwise valid mesh is accepted.
    minimum_shape_metric: 0.000001
    maximum_adjacent_normal_angle_deg: 180.0

    cap_wrap_x: 0.15
    cap_width_frac: 0.50
    tip_inner_scale: 0.60
    tip_dome_scale: 0.0
    tip_conformal_ring: false
    tip_smooth_iters: 20
    chordwise_distribution: uniform
    chordwise_beta: 2.0
    spanwise_distribution: uniform
    spanwise_beta: 2.0
    spanwise_allocation: proportional

acceptance:
  # The full campaign refuses to start while an enabled limit is null.
  # Set enabled=false for metrics you explicitly choose not to gate.
  require_limits_for_run: true
  metrics:
    oml.min_shape_metric:
      {operator: ">=", limit: null, enabled: true, description: "Verdict quad Shape; larger is better"}
    oml.min_scaled_jacobian:
      {operator: ">=", limit: null, enabled: true, description: "Worst corner scaled Jacobian; larger is better"}
    oml.min_triangle_normal_alignment:
      {operator: ">=", limit: null, enabled: true, description: "Internal quad-fold diagnostic; larger is better"}
    oml.max_equiangle_skewness:
      {operator: "<=", limit: null, enabled: true, description: "Worst OML equiangle skewness; smaller is better"}
    oml.max_aspect_ratio:
      {operator: "<=", limit: null, enabled: true, description: "Worst OML surface-cell aspect ratio"}
    oml.max_growth_ratio:
      {operator: "<=", limit: null, enabled: true, description: "Worst adjacent tangential cell-size ratio"}
    oml.max_adjacent_normal_angle_deg:
      {operator: "<=", limit: null, enabled: true, description: "Worst rotation between adjacent cell normals"}

    tip.min_shape_metric:
      {operator: ">=", limit: null, enabled: true, description: "Tip/collar quad Shape; larger is better"}
    tip.min_scaled_jacobian:
      {operator: ">=", limit: null, enabled: true, description: "Worst tip corner scaled Jacobian"}
    tip.min_triangle_normal_alignment:
      {operator: ">=", limit: null, enabled: true, description: "Tip internal quad-fold diagnostic"}
    tip.max_equiangle_skewness:
      {operator: "<=", limit: null, enabled: true, description: "Worst tip equiangle skewness"}
    tip.max_aspect_ratio:
      {operator: "<=", limit: null, enabled: true, description: "Worst tip/collar surface-cell aspect ratio"}
    tip.max_growth_ratio:
      {operator: "<=", limit: null, enabled: true, description: "Worst tip adjacent cell-size ratio"}
    tip.max_adjacent_normal_angle_deg:
      {operator: "<=", limit: null, enabled: true, description: "Worst tip adjacent-normal rotation"}

projection_diagnostic:
  enabled: true
  sample_nodes: 500
