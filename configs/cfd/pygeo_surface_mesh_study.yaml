schema: aeris.pygeo_surface_mesh_study.v2
name: pygeo_bwb_surface_mesh_geometry_laws_aiaa

geometry:
  # Canonical BWB geometry; the run manifest hashes this exact file.
  definition_config: configs/geometry/bwb.yaml
  airfoil_database: data/airfoil_database

  # These fields are deliberately outside the clean-OML inferential space.
  # dihedral_b1 is pinned by enforce_flat_root_panel. Elevon geometry belongs
  # to a separate split-CAD/topology study and does not change the neutral OML.
  fixed_sample_values:
    dihedral_b1_deg: 0.0
    elevon_start_frac: 0.60
    elevon_end_frac: 0.95
    elevon_hinge_frac: 0.75

  extraction:
    source_sections: 14
    chordwise_points: 301
    cst_order: 8
    minimum_spacing_fraction: 0.0001

# Independent attribution factors. Public sweep is positive aft sweep; Aeris
# stores aft sweep as negative, hence sample_scale=-1. Aspect ratio, panel
# taper, dimensional thickness, thickness ratio, curvature, twist rate, and
# dihedral rate are realised descriptors recorded for every geometry.
variables:
  root_chord_m:
    {sample_field: c1_m, units: m, baseline: 0.90, low: 0.70, high: 1.10, description: "Root chord c1"}
  chord_ratio_b1_root:
    {sample_field: c2_ratio, units: "1", baseline: 0.675, low: 0.55, high: 0.80, description: "c2/c1"}
  chord_ratio_b2_root:
    {sample_field: c3_ratio, units: "1", baseline: 0.425, low: 0.30, high: 0.55, description: "c3/c1"}
  tip_taper_ratio:
    {sample_field: c4_ratio, units: "1", baseline: 0.14, low: 0.08, high: 0.20, description: "c4/c1"}
  semi_span_m:
    {sample_field: b_total_m, units: m, baseline: 1.00, low: 0.75, high: 1.25, description: "Implemented semi-span; full span is 2b"}
  outer_panel_span_fraction:
    {sample_field: b3_ratio, units: "1", baseline: 0.475, low: 0.40, high: 0.55, description: "b3/b"}
  inner_remaining_span_split:
    {sample_field: split_ratio, units: "1", baseline: 0.50, low: 0.40, high: 0.60, description: "b1/(b1+b2)"}

  inner_le_sweep_deg:
    {sample_field: sw1_deg, units: deg, baseline: 30.0, low: 20.0, high: 40.0, sample_scale: -1.0}
  mid_le_sweep_deg:
    {sample_field: sw2_deg, units: deg, baseline: 25.0, low: 15.0, high: 35.0, sample_scale: -1.0}
  outer_le_sweep_deg:
    {sample_field: sw3_deg, units: deg, baseline: 15.0, low: 5.0, high: 25.0, sample_scale: -1.0}

  twist_root_deg:
    {sample_field: twist_b0_deg, units: deg, baseline: 0.0, low: -1.0, high: 1.0}
  twist_b1_deg:
    {sample_field: twist_b1_deg, units: deg, baseline: -1.5, low: -3.0, high: 0.0}
  twist_b2_deg:
    {sample_field: twist_b2_deg, units: deg, baseline: -3.0, low: -5.0, high: -1.0}
  twist_tip_deg:
    {sample_field: twist_b3_deg, units: deg, baseline: -5.0, low: -8.0, high: -2.0}

  dihedral_b2_deg:
    {sample_field: dihedral_b2_deg, units: deg, baseline: 3.0, low: 0.0, high: 6.0}
  dihedral_tip_deg:
    {sample_field: dihedral_b3_deg, units: deg, baseline: 5.0, low: 0.0, high: 10.0}

design:
  # Eight signed levels plus the separate baseline give a nine-point response
  # curve for every factor and stable local slope/curvature estimates.
  ofat:
    fractions: [-1.0, -0.75, -0.50, -0.25, 0.25, 0.50, 0.75, 1.0]

  # All C(16,2)=120 pairs at four low/high corners: 480 cases. No pair is
  # selected or discarded using the response, avoiding screening bias.
  pairwise:
    enabled: true
    fractions: [-1.0, 1.0]
    max_cases: 480

  # All 16 factors change simultaneously. A scrambled low-discrepancy design
  # trains the global response surface; an independent IID uniform design is held
  # out and never used for fitting or hyperparameter selection.
  global:
    method: sobol
    samples: 1024
    seed: 20260724
  validation:
    method: iid_uniform
    samples: 512
    seed: 20260725

mesh:
  reference_level: L3

  # Research runs evaluate every level for every geometry. Adaptive stopping
  # would create informative missingness and biased level-transition laws.
  complete_ladder: true

  levels:
    L1:
      {order: 1, points_per_block_side: 25, spanwise_panels_per_section: 8, cap_wrap_points: 5, tip_radial_points: 5}
    L2:
      {order: 2, points_per_block_side: 33, spanwise_panels_per_section: 12, cap_wrap_points: 7, tip_radial_points: 5}
    L3:
      {order: 3, points_per_block_side: 49, spanwise_panels_per_section: 16, cap_wrap_points: 9, tip_radial_points: 7}
    L4:
      {order: 4, points_per_block_side: 65, spanwise_panels_per_section: 24, cap_wrap_points: 11, tip_radial_points: 9}
    L5:
      {order: 5, points_per_block_side: 97, spanwise_panels_per_section: 32, cap_wrap_points: 13, tip_radial_points: 9}

  common:
    oml_topology: cap4
    tip_topology: airfoil_face
    dense_airfoil_points_per_surface: 301
    split_x_fore: 0.20
    minimum_te_thickness: 0.002
    te_thickness: 0.005
    te_thickness_abs_floor: 0.0
    te_base_points: 0
    minimum_shape_metric: 0.000001
    maximum_adjacent_normal_angle_deg: 180.0
    cap_wrap_x: 0.40
    cap_width_frac: 0.50
    tip_inner_scale: 0.60
    tip_dome_scale: 0.0
    tip_conformal_ring: false
    tip_smooth_iters: 0
    chordwise_distribution: uniform
    chordwise_beta: 2.0
    spanwise_distribution: uniform
    spanwise_beta: 2.0
    spanwise_allocation: proportional

mesh_control:
  # Second law layer: vary geometry and individual mesh knobs together so the
  # future meshing agent can prescribe which knob to change, not only which
  # bundled L1-L5 level to try next. These cases run one explicit mesh each.
  enabled: true
  train:
    method: sobol
    samples: 2048
    seed: 20260726
  validation:
    method: iid_uniform
    samples: 1024
    seed: 20260727
  variables:
    chordwise_block_points:
      {parameter: points_per_block_side, units: points, baseline: 49, low: 25, high: 97, integer: true, odd: true, description: "Chordwise/block-side structured resolution"}
    spanwise_panels_per_section:
      {parameter: spanwise_panels_per_section, units: panels, baseline: 16, low: 8, high: 32, integer: true, odd: false, description: "Spanwise panels between realised pyGeo source sections"}
    cap_wrap_points:
      {parameter: cap_wrap_points, units: points, baseline: 9, low: 5, high: 13, integer: true, odd: true, description: "LE/TE cap wrap resolution inside the verified nonfolding airfoil-face tip domain"}
    tip_radial_points:
      {parameter: tip_radial_points, units: points, baseline: 7, low: 5, high: 9, integer: true, odd: true, description: "LE/TE curvature-blend control for the collar-free airfoil-face tip cap"}

acceptance:
  require_limits_for_run: true
  metrics:
    oml.min_shape_metric:
      {operator: ">=", limit: 0.08, enabled: true, description: "Verdict quad Shape; larger is better"}
    oml.min_scaled_jacobian:
      {operator: ">=", limit: 0.50, enabled: true, description: "Worst corner scaled Jacobian; larger is better"}
    oml.min_triangle_normal_alignment:
      {operator: ">=", limit: 0.95, enabled: true, description: "Internal quad-fold diagnostic; larger is better"}
    oml.max_equiangle_skewness:
      {operator: "<=", limit: 0.50, enabled: true, description: "Worst OML equiangle skewness; smaller is better"}
    oml.max_aspect_ratio:
      {operator: "<=", limit: 25.0, enabled: true, description: "Worst OML surface-cell aspect ratio"}
    oml.max_growth_ratio:
      {operator: "<=", limit: 2.50, enabled: true, description: "Worst adjacent tangential cell-size ratio"}
    oml.max_adjacent_normal_angle_deg:
      {operator: "<=", limit: 170.0, enabled: true, description: "Worst rotation between adjacent cell normals"}
    tip.min_shape_metric:
      {operator: ">=", limit: 0.03, enabled: true, description: "Tip-cap quad Shape; larger is better"}
    tip.min_scaled_jacobian:
      {operator: ">=", limit: 0.03, enabled: true, description: "Worst tip corner scaled Jacobian"}
    tip.min_triangle_normal_alignment:
      {operator: ">=", limit: 0.95, enabled: true, description: "Tip internal quad-fold diagnostic"}
    tip.max_equiangle_skewness:
      {operator: "<=", limit: 0.98, enabled: true, description: "Worst tip equiangle skewness"}
    tip.max_aspect_ratio:
      {operator: "<=", limit: 10.0, enabled: true, description: "Worst tip-cap surface-cell aspect ratio"}
    tip.max_growth_ratio:
      {operator: "<=", limit: 2.50, enabled: true, description: "Worst tip adjacent cell-size ratio"}
    tip.max_adjacent_normal_angle_deg:
      {operator: "<=", limit: 10.0, enabled: true, description: "Worst tip adjacent-normal rotation"}

analysis:
  local_polynomial_max_degree: 3
  global_model:
    basis: orthonormal_legendre_quadratic
    regularization: ridge
    cv_folds: 10
    ridge_lambdas: [0.0, 1.0e-10, 1.0e-8, 1.0e-6, 1.0e-4, 1.0e-2, 1.0, 100.0]
    bootstrap_replicates: 200
    conformal_coverage: 0.99
  validation:
    max_normalized_rmse: 0.05
    minimum_r2: 0.90
    maximum_false_accepts: 0
    maximum_false_accept_probability_upper_95: 0.02
  applicability:
    require_exact_airfoil_signature: true
    reject_extrapolation: true
  # If validation gates fail, this study revision remains non-deployable.
  # Enrichment must be registered as a new training campaign with a fresh
  # independent validation set, not mixed into the existing holdout.

projection_diagnostic:
  enabled: true
  sample_nodes: 500
