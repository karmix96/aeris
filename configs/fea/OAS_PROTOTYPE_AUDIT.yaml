source_directory: /home/mike/Desktop/Start_Up/Code/5_OpenAeroStruct
decision: >-
  Reuse the OpenMDAO/OpenAeroStruct connection patterns only. Production FEA
  must read canonical AERIS stations, the locked S8 design row, and the S8
  mission authority; none of these standalone scripts is a geometry, flight,
  material, or load authority.
accepted_patterns:
  - tip-to-root half-wing ordering for OpenAeroStruct symmetry
  - AeroPoint plus Geometry connection topology
  - sectional-force extraction from bwb_sec_forces
  - direct consumption of AERIS station artifacts
corrected_in_production:
  - sea-level 25/30 m/s defaults replaced by the 28 m/s, 1500 m S8 authority
  - random local planforms replaced by lhs100_seed42 locked design rows
  - twist rotates the local chord about its own leading edge; z_le is not rotated about global z=0
  - Reynolds is supplied per metre to OpenAeroStruct
  - drag is informational because the comparison model is inviscid
  - OAS beam stress is not used to validate local CalculiX shell stress
