# AERIS — the single canonical BWB geometry config (see DECISION-0001 / 0002).
#
# ONE config, BOTH backends:
#   - AeroSandbox : outputs.build_aerosandbox: true
#   - pyGeo       : pygeo.enabled: true   (both true = cross-check)
#
# All bounds are RANGES sized for a small BWB ISR UAV → this file IS the DoE
# design space. Sampling it with a fixed seed gives one deterministic geometry
# (the baseline). See DECISION-0002 for the 20 design variables and rationale.
#
# Fixed station airfoils at b0/b1/b2/b3 (Panagiotou & Yakinthos BWB UAV):
# mh91 / mh91 / e374 / nlf1015. Swap any name for a data/airfoil_database entry.
#
# NOTHING is saved unless explicitly requested at run time (CLI flag / GUI toggle):
# every output/plot/CAD/mesh export defaults to OFF here.
name: bwb_segmented

geometry:
  generator:
    id: bwb_segmented      # renamed from bwb_segmented_v1
    seed: 1001

  controls:
    n_points: 12
    n_spline_inboard: 12
    n_spline_outboard: 6
    spline_split_ratio: 0.55
    desired_curvature_strength: 0.85
    segment_length_variation: 0.0
    sweep_variation: 0.0

  # ── DoE design space — small BWB ISR UAV (PROPOSED; adjust the scale freely) ──
  planform_bounds:
    c1_m:        {min: 0.55, max: 0.90}   # root chord [m]
    c2_ratio:    {min: 0.55, max: 0.80}   # chord at b1 / c1
    c3_ratio:    {min: 0.35, max: 0.60}   # chord at b2 / c1
    c4_ratio:    {min: 0.10, max: 0.25}   # tip chord  / c1
    b_total_m:   {min: 1.80, max: 2.80}   # full span [m]
    b3_ratio:    {min: 0.40, max: 0.55}   # outer-panel span fraction
    split_ratio: {min: 0.40, max: 0.60}   # inner/outer LE-spline split
    sw1_deg:     {min: 20.0, max: 40.0}   # inner LE sweep
    sw2_deg:     {min: 15.0, max: 35.0}   # mid   LE sweep
    sw3_deg:     {min:  5.0, max: 25.0}   # outer LE sweep

  section_bounds:
    # Fallback airfoil, used ONLY if station_airfoils is absent. With
    # station_airfoils present (below) it is overridden per station, so this is
    # just a schema default — kept = the root airfoil to avoid confusion.
    airfoil_name: mh91

    # Root dihedral is fixed at 0 and the whole b0->b1 root panel is held flat
    # (dihedral_b1 pinned to 0 + enforce_flat_root_panel below): the root airfoil
    # sits at zero dihedral by construction.
    dihedral_root_deg: 0.0

    twist_b0_deg: {min: -1.0, max: 1.0}
    twist_b1_deg: {min: -3.0, max: 0.0}
    twist_b2_deg: {min: -5.0, max: -1.0}
    twist_b3_deg: {min: -8.0, max: -2.0}   # tip washout

    dihedral_b1_deg: {min: 0.0, max: 0.0}  # PINNED 0 — flat root panel invariant
    dihedral_b2_deg: {min: 0.0, max: 6.0}
    dihedral_b3_deg: {min: 0.0, max: 10.0}

    # Four fixed station airfoils. Swap for any data/airfoil_database entry.
    station_airfoils:
      b0: mh91
      b1: mh91
      b2: e374
      b3: nlf1015

  # ── Elevon geometry as DoE variables (adds 3 DVs → 20 total) ──────────────
  # Present ⇒ the sampler varies elevon size/position across the DoE, so the
  # optimizer can later find the elevon that meets the controllability spec.
  elevon_bounds:
    elevon_start_frac: {min: 0.50, max: 0.70}
    elevon_end_frac:   {min: 0.85, max: 0.98}
    elevon_hinge_frac: {min: 0.65, max: 0.82}

  outputs:
    save_plot: false             # nothing saved unless requested at run time
    build_aerosandbox: false     # true = AeroSandbox backend (or both)

  control_surfaces:
    enabled: true                # false = clean wing, no control surface
    surfaces:
      # One trailing-edge elevon PAIR. Symmetric command (delta_e_sym) = pitch;
      # differential command (delta_a_diff) = roll. Both are supported via the
      # mixing right = de_sym + da_diff, left = de_sym - da_diff.
      - name: elevon
        family: trailing_edge
        hinge_point: 0.75
        symmetric: true
        required: true
        deflection_sign: standard
        spanwise: {start_frac: 0.60, end_frac: 0.95}

  pygeo:
    enabled: true                # false = AeroSandbox-only
    airfoil_database: data/airfoil_database
    k_span: 3
    frame_mode: aeris_frame
    n_ctl: null
    tip: none
    tip_scale: 0.25
    enforce_flat_root_panel: true   # enforces dihedral_root = 0 AND dihedral_b1 = 0

    extraction:
      spanwise_sections: 25
      chordwise_points: 241
      cst_order: 8

    surface_sampling:
      chordwise_points: 141
      spanwise_points: 121

    quality:
      warn_plane_warp_chord: 3.0e-3
      max_plane_warp_chord: 1.0e-2
      max_cst_rms_chord: 1.0e-3
      fail_on_rejection: true

    # Deflection commands. Symmetric (pitch) + differential (roll). 0 = neutral.
    commands:
      delta_e_sym_deg: 0.0
      delta_a_diff_deg: 0.0

    physical_cad:
      enabled: false             # split-elevon CAD off unless requested
      topology: split_elevon
      design_deflection_limit_deg: 20.0
      hinge_gap_fraction: 0.005
      boundary_clearance_fraction: 0.005
      chordwise_points: 81
      minimum_te_thickness_fraction: 5.0e-4
      tessellation_tolerance_m: 7.5e-4
      tessellation_angular_tolerance_rad: 0.12
      max_master_to_cad_deviation_cref: 0.005
      fail_on_invalid: true

    # Everything OFF by default — enable per run via CLI flag / GUI toggle.
    outputs:
      write_iges: false
      write_tecplot: false
      write_surface_npz: false
      write_section_dat: false
      write_step: false
      verify_step_import: false
      write_brep: false
      write_stl: false
      write_obj: false
      write_vtk: false
      write_cad_npz: false
      save_visualization: false
      visualization_dpi: 180
