name: bwb_25_sections_asym_controls

geometry:
  generator:
    id: bwb_segmented_v1
    seed: 100

  controls:
    n_points: 10
    n_spline_inboard: 16
    n_spline_outboard: 10
    spline_split_ratio: 0.55
    segment_length_variation: 0.0
    sweep_variation: 0.0
    desired_curvature_strength: 1.0

  planform_bounds:
    c1_m:      {min: 1.6000, max: 1.6001}
    c2_ratio:  {min: 0.5500, max: 0.5501}
    c3_ratio:  {min: 0.3800, max: 0.3801}
    c4_ratio:  {min: 0.1200, max: 0.1201}
    b_total_m: {min: 1.6000, max: 1.6001}
    b3_ratio:  {min: 0.5000, max: 0.5001}
    split_ratio: {min: 0.4500, max: 0.4501}
    sw1_deg:   {min: 40.0000, max: 40.0001}
    sw2_deg:   {min: 25.0000, max: 25.0001}
    sw3_deg:   {min: 10.0000, max: 10.0001}

  section_bounds:
    airfoil_name: naca4412
    dihedral_root_deg: 0.0

    twist_b0_deg: {min: 0.0000, max: 0.0001}
    twist_b1_deg: {min: 0.0000, max: 0.0001}
    twist_b2_deg: {min: 0.0000, max: 0.0001}
    twist_b3_deg: {min: 0.0000, max: 0.0001}

    dihedral_b1_deg: {min: 0.0000, max: 0.0001}
    dihedral_b2_deg: {min: 0.0000, max: 0.0001}
    dihedral_b3_deg: {min: 0.0000, max: 0.0001}

  control_surfaces:
    enabled: true
    surfaces:
      - name: elevon_sym
        family: trailing_edge
        hinge_point: 0.75
        symmetric: true
        spanwise:
          start_frac: 0.30
          end_frac: 0.50
        deflection_sign: standard
        required: false

      - name: elevon_diff
        family: trailing_edge
        hinge_point: 0.75
        symmetric: false
        side: right
        spanwise:
          start_frac: 0.60
          end_frac: 0.95
        deflection_sign: standard
        required: false

  outputs:
    save_plot: true
    build_aerosandbox: true

dataset:
  sampling:
    method: lhs_v1
    seed: 123
