# AERIS — BWB canary config (fixed geometry, 25 sections, sym + diff controls)
#
# Purpose: regression canary and AVL wiring verification.
#   - Fixed planform (seed 100, same reference geometry as baseline_bwb_25)
#   - 25 sections (higher fidelity than baseline_bwb_25 which uses 14)
#   - Two control surfaces: elevon_sym (d1, pitch) + elevon_diff (d2, roll)
#   - Use with --control-input-values and --diff-input-values to test both sweeps
#   - NOT for ML training (all bounds fixed)
#
# Typical usage:
#   aeris dataset aero-generate -c configs/geometry/bwb_canary_fixed.yaml \
#     --n 1 --name canary_sym \
#     --alpha-values "-4,0,4" --velocity-values "28" --altitude-values "0" \
#     --control-input-values "-10,0,10"
#
#   aeris dataset aero-generate -c configs/geometry/bwb_canary_fixed.yaml \
#     --n 1 --name canary_diff \
#     --alpha-values "-4,0,4" --velocity-values "28" --altitude-values "0" \
#     --control-input-values "0" --diff-input-values "-10,0,10"

name: bwb_canary_fixed

geometry:
  generator:
    id: bwb_segmented_v1
    seed: 100

  controls:
    n_points: 10
    n_spline_inboard: 16
    n_spline_outboard: 10
    spline_split_ratio: 0.55
    segment_length_variation: 0.0
    sweep_variation: 0.0
    desired_curvature_strength: 1.0

  planform_bounds:
    c1_m:        {min: 1.6000, max: 1.6001}
    c2_ratio:    {min: 0.5500, max: 0.5501}
    c3_ratio:    {min: 0.3800, max: 0.3801}
    c4_ratio:    {min: 0.1200, max: 0.1201}
    b_total_m:   {min: 1.6000, max: 1.6001}
    b3_ratio:    {min: 0.5000, max: 0.5001}
    split_ratio: {min: 0.4500, max: 0.4501}
    sw1_deg:     {min: 40.0000, max: 40.0001}
    sw2_deg:     {min: 25.0000, max: 25.0001}
    sw3_deg:     {min: 10.0000, max: 10.0001}

  section_bounds:
    airfoil_name: naca4412
    dihedral_root_deg: 0.0
    twist_b0_deg:    {min: 0.0, max: 0.0001}
    twist_b1_deg:    {min: 0.0, max: 0.0001}
    twist_b2_deg:    {min: 0.0, max: 0.0001}
    twist_b3_deg:    {min: 0.0, max: 0.0001}
    dihedral_b1_deg: {min: 0.0, max: 0.0001}
    dihedral_b2_deg: {min: 0.0, max: 0.0001}
    dihedral_b3_deg: {min: 0.0, max: 0.0001}

  control_surfaces:
    enabled: true
    surfaces:
      # d1 — symmetric pitch authority
      - name: elevon_sym
        family: trailing_edge
        hinge_point: 0.75
        symmetric: true
        spanwise:
          start_frac: 0.60
          end_frac: 0.95
        deflection_sign: standard
        required: false

      # d2 — antisymmetric roll authority
      # symmetric=False, Wing(symmetric=True) → ASB: gain=+1 right, gain=-1 left
      - name: elevon_diff
        family: trailing_edge
        hinge_point: 0.75
        symmetric: false
        side: right
        spanwise:
          start_frac: 0.60
          end_frac: 0.95
        deflection_sign: standard
        required: false

  outputs:
    save_plot: true
    build_aerosandbox: true

dataset:
  sampling:
    method: lhs_v1
    seed: 123
