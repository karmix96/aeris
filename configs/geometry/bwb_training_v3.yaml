name: bwb_training_v3
geometry:
  generator: {id: bwb_segmented_v1, seed: 100}
  controls:
    n_points: 10
    n_spline_inboard: 10
    n_spline_outboard: 5
    spline_split_ratio: 0.55
    segment_length_variation: 0.15
    sweep_variation: 0.05
    desired_curvature_strength: 0.80
  planform_bounds:
    c1_m:        {min: 1.20, max: 2.00}
    c2_ratio:    {min: 0.45, max: 0.65}
    c3_ratio:    {min: 0.30, max: 0.45}
    c4_ratio:    {min: 0.08, max: 0.20}
    b_total_m:   {min: 1.20, max: 2.00}
    b3_ratio:    {min: 0.45, max: 0.55}
    split_ratio: {min: 0.35, max: 0.55}
    sw1_deg:     {min: 30.0, max: 55.0}
    sw2_deg:     {min: 10.0, max: 45.0}
    sw3_deg:     {min:  0.0, max: 30.0}
  section_bounds:
    airfoil_name: naca4412
    dihedral_root_deg: 0.0
    twist_b0_deg:    {min: -2.0, max: 2.0}
    twist_b1_deg:    {min: -4.0, max: 2.0}
    twist_b2_deg:    {min: -5.0, max: 2.0}
    twist_b3_deg:    {min: -6.0, max: 2.0}
    dihedral_b1_deg: {min:  0.0, max:  5.0}
    dihedral_b2_deg: {min:  0.0, max:  8.0}
    dihedral_b3_deg: {min:  0.0, max: 10.0}
  elevon_bounds:
    elevon_start_frac: {min: 0.50, max: 0.65}
    elevon_end_frac:   {min: 0.80, max: 0.98}
    elevon_hinge_frac: {min: 0.65, max: 0.85}
  control_surfaces:
    enabled: true
    surfaces:
      - name: elevon_sym
        family: trailing_edge
        hinge_point: 0.75
        symmetric: true
        spanwise: {start_frac: 0.60, end_frac: 0.95}
        deflection_sign: standard
        required: false
      - name: elevon_diff
        family: trailing_edge
        hinge_point: 0.75
        symmetric: false
        side: right
        spanwise: {start_frac: 0.60, end_frac: 0.95}
        deflection_sign: standard
        required: false
  outputs:
    save_plot: false
    build_aerosandbox: true
dataset:
  sampling:
    method: lhs_v1
    seed: 123
