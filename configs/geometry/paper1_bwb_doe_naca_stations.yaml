# AERIS Paper 1 DoE — Prescribed Station Airfoils, wide bounds
# Fixed airfoil shapes; planform/twist/dihedral DVs are sampled.
name: paper1_bwb_doe_naca_stations
geometry:
  generator: {id: bwb_segmented_v1, seed: 42}
  controls:
    n_points: 10
    n_spline_inboard: 10
    n_spline_outboard: 5
    spline_split_ratio: 0.55
    desired_curvature_strength: 1.0
    segment_length_variation: 0.0
    sweep_variation: 0.0
  planform_bounds:
    c1_m:        {min: 1.40, max: 2.20}
    c2_ratio:    {min: 0.40, max: 0.70}
    c3_ratio:    {min: 0.20, max: 0.50}
    c4_ratio:    {min: 0.05, max: 0.20}
    b_total_m:   {min: 1.40, max: 2.20}
    b3_ratio:    {min: 0.30, max: 0.60}
    split_ratio: {min: 0.30, max: 0.70}
    sw1_deg:     {min: 30, max: 55}
    sw2_deg:     {min: 15, max: 35}
    sw3_deg:     {min: 5,  max: 20}
  section_bounds:
    airfoil_name: naca23012
    dihedral_root_deg: 0.0
    twist_b0_deg:    {min: -2.0, max: 2.0}
    twist_b1_deg:    {min: -4.0, max: 1.0}
    twist_b2_deg:    {min: -5.0, max: 0.0}
    twist_b3_deg:    {min: -6.0, max: 0.0}
    dihedral_b1_deg: {min: 0.0, max: 3.0}
    dihedral_b2_deg: {min: 1.0, max: 5.0}
    dihedral_b3_deg: {min: 2.0, max: 8.0}
    station_airfoils:
      b0: naca23012
      b1: naca4412
      b2: naca2412
      b3: naca0012
  outputs: {save_plot: false, build_aerosandbox: true}
  control_surfaces:
    enabled: true
    surfaces:
      - name: elevon
        family: trailing_edge
        hinge_point: 0.75
        symmetric: true
        required: false
        deflection_sign: standard
        spanwise: {start_frac: 0.60, end_frac: 0.95}
dataset:
  sampling: {method: lhs_v2, seed: 42}
