# Canonical neutral geometry for the pyGeo surface-mesh sensitivity study.
#
# The baseline is deliberately simple:
#   - fixed MH-91, MH-91, E374, NLF1015 station airfoils
#   - zero sweep, twist, and dihedral
#   - three equal semispan panels
#   - linear 1.60 -> 1.20 -> 0.80 -> 0.40 m chord taper
#
# Bounds are intentionally wider than the baseline. They validate the direct
# samples constructed by the study runner; this file is not itself sampled.
name: pygeo_surface_study_simple

geometry:
  generator:
    id: bwb_segmented_v1
    seed: 20260724

  controls:
    # With equal baseline panels, 12 intervals give four authored controls
    # per panel. The finer spline lattice is the pyGeo loft input; the mesh
    # study independently extracts 14 uniform realised-surface sections.
    n_points: 13
    n_spline_inboard: 17
    n_spline_outboard: 9
    spline_split_ratio: 0.6666666666666666
    desired_curvature_strength: 0.85
    segment_length_variation: 0.0
    sweep_variation: 0.0

  planform_bounds:
    c1_m:        {min: 1.20, max: 2.00}
    c2_ratio:    {min: 0.65, max: 0.85}
    c3_ratio:    {min: 0.40, max: 0.60}
    c4_ratio:    {min: 0.15, max: 0.35}
    b_total_m:   {min: 1.20, max: 2.00}
    b3_ratio:    {min: 0.25, max: 0.45}
    split_ratio: {min: 0.35, max: 0.65}

    # Positive magnitudes in YAML; BWBDesignSample stores aft sweep negative.
    sw1_deg: {min: 0.0, max: 55.0}
    sw2_deg: {min: 0.0, max: 35.0}
    sw3_deg: {min: 0.0, max: 25.0}

  section_bounds:
    airfoil_name: mh91
    dihedral_root_deg: 0.0
    station_airfoils:
      b0: mh91
      b1: mh91
      b2: e374
      b3: nlf1015

    twist_b0_deg: {min: -6.0, max: 6.0}
    twist_b1_deg: {min: -8.0, max: 6.0}
    twist_b2_deg: {min: -10.0, max: 5.0}
    twist_b3_deg: {min: -12.0, max: 4.0}

    dihedral_b1_deg: {min: -8.0, max: 8.0}
    dihedral_b2_deg: {min: -10.0, max: 12.0}
    dihedral_b3_deg: {min: -12.0, max: 15.0}

  outputs:
    save_plot: false
    build_aerosandbox: false

  control_surfaces:
    enabled: false
    surfaces: []

  pygeo:
    enabled: true
    airfoil_database: data/airfoil_database
    k_span: 3
    frame_mode: aeris_frame
    tip: none
    tip_scale: 0.25

    # Required so dihedral_b1 can be studied. Non-zero b1 dihedral cases are
    # valid half-wing mesh diagnostics, but need a separate mirrored-root CAD
    # review before they are treated as production symmetric aircraft.
    enforce_flat_root_panel: false

    extraction:
      spanwise_sections: 14
      chordwise_points: 301
      cst_order: 8
    surface_sampling:
      chordwise_points: 141
      spanwise_points: 121
    quality:
      warn_plane_warp_chord: 0.003
      max_plane_warp_chord: 0.010
      max_cst_rms_chord: 0.001
      fail_on_rejection: true
    physical_cad:
      enabled: false
    outputs:
      write_iges: false
      write_tecplot: false
      write_surface_npz: false
      write_section_dat: false
      write_step: false
      verify_step_import: false
      write_brep: false
      write_stl: false
      write_obj: false
      write_vtk: false
      write_cad_npz: false
      save_visualization: false
