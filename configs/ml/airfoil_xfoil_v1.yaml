# AERIS 2D — ML training config for XFOIL airfoil datasets
# Features match the airfoil_xfoil_v1 feature preset.
# Targets: cl, cd, cm
# Group key: airfoil_id (same split rule as geometry_id in 3D)

ml:
  dataset: data/datasets/<promoted_airfoil_dataset>
  feature_preset: airfoil_xfoil_v1
  targets:
    - cl
    - cd
    - cm
  split:
    method: grouped
    group_column: airfoil_id
    train_fraction: 0.70
    val_fraction:   0.15
    test_fraction:  0.15
    random_seed: 123
  model:
    type: lightgbm
    params: {}
  output_dir: data/processed/ml_runs/airfoil_xfoil_v1
