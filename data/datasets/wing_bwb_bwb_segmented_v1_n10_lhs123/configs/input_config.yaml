name: wing_bwb

geometry:
  generator:
    family: bwb_segmented
    version: v1
    seed: 100

  controls:
    n_points: 10
    n_spline_inboard: 50
    n_spline_outboard: 50
    desired_curvature_strength: 0.3
    spline_split_ratio: 0.55
    segment_length_variation: 0.25
    sweep_variation: 0.10

  planform_bounds:
    c1_m:
      min: 1.2
      max: 2.0

    c2_ratio:
      min: 0.45
      max: 0.65

    c3_ratio:
      min: 0.30
      max: 0.45

    c4_ratio:
      min: 0.07
      max: 0.20

    b_total_m:
      min: 1.2
      max: 2.0

    b3_ratio:
      min: 0.45
      max: 0.55

    split_ratio:
      min: 0.35
      max: 0.55

    sw1_deg:
      min: 25.0
      max: 60.0

    sw2_deg:
      min: 10.0
      max: 60.0

    sw3_deg:
      min: 0.0
      max: 40.0

  section_bounds:
    airfoil_name: naca4412
    dihedral_root_deg: 0.0

    twist_b0_deg:
      min: -5.0
      max: 5.0
    twist_b1_deg:
      min: -5.0
      max: 5.0
    twist_b2_deg:
      min: -5.0
      max: 5.0
    twist_b3_deg:
      min: -5.0
      max: 5.0

    dihedral_b1_deg:
      min: -5.0
      max: 5.0
    dihedral_b2_deg:
      min: -5.0
      max: 5.0
    dihedral_b3_deg:
      min: -5.0
      max: 5.0

  outputs:
    save_plot: true
    build_aerosandbox: true
