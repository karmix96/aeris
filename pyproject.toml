[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeris"
version = "0.1.0"
description = "Cross-platform Python platform for aircraft design, geometry generation, simulation workflows, datasets, AI models, and optimization."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Michail Karalis" }
]
dependencies = [
  "typer>=0.12",
  "PyYAML>=6.0",
  "numpy>=1.26",
  "scipy>=1.13",
  "matplotlib>=3.8",
  "aerosandbox>=4.2",
  "scikit-learn>=1.5",
  "h5py>=3.10",
  "platformdirs>=4.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "black>=24.0",
  "mypy>=1.10"
]
# Pure-PyPI deps for the pyGeo geometry backend: physical-CAD control surfaces
# (CadQuery/OCC), Gmsh import audit, and Plotly geometry visualization.
# NOTE: pyGeo/pySpline are NOT here — they require a Fortran/C++ toolchain at
# build time. Install them via the `geometry-mdolab` group or from .deps/mdolab.
# See docs/INSTALL_PYGEO.md.
geometry = [
  "cadquery>=2.7",
  "gmsh>=4.15",
  "plotly>=6.7",
]
# MDO Lab geometry kernel. Requires a working Fortran + C++ compiler and CMake
# (pySpline builds native extensions). Pinned to the versions AERIS is validated
# against. See docs/INSTALL_PYGEO.md for the source-build path under .deps/mdolab.
geometry-mdolab = [
  "pyspline==1.5.4",
  "pygeo==1.17.0",
]
fea-validation = [
  "openaerostruct==2.12.0",
]

[project.scripts]
aeris = "aeris.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aeris = ["cfd/presets/data/*.yaml"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: marks integration tests",
    "avl: marks tests that require AVL",
]
