[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeris"
version = "0.1.0"
description = "Cross-platform aircraft design and simulation workflow platform"
readme = "README.md"
requires-python = ">=3.13"
authors = [
  { name = "Mike Karalis" }
]
dependencies = [
  "typer>=0.12,<1.0",
  "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6"
]

[project.scripts]
aeris = "aeris.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
