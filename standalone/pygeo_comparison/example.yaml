name: pygeo_standalone_demo
symmetric: true
airfoil_file: ../../data/airfoil_database/naca0012.dat

# Each row is one authored right-half-wing station.
# Axes: x forward, y starboard/spanwise, z up.
stations:
  - {x_le_m: 0.00, y_m: 0.00, z_le_m: 0.00, chord_m: 1.60, twist_deg:  0.0}
  - {x_le_m: 0.04, y_m: 0.40, z_le_m: 0.01, chord_m: 1.40, twist_deg: -0.5}
  - {x_le_m: 0.16, y_m: 0.90, z_le_m: 0.04, chord_m: 1.05, twist_deg: -1.2}
  - {x_le_m: 0.36, y_m: 1.40, z_le_m: 0.08, chord_m: 0.65, twist_deg: -2.0}
  - {x_le_m: 0.62, y_m: 1.80, z_le_m: 0.13, chord_m: 0.25, twist_deg: -3.0}

pygeo:
  k_span: 3
  n_ctl: null
  tip: rounded
  tip_scale: 0.25

outputs:
  write_iges: true
  write_tecplot: true
